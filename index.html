<script id="appDataJson" type="application/json">{"title":"续费全流程实战","lsPrefix":"cn_lp_renewal","orgName":"VIPTHINK","aiBaseUrl":"https://api.xiaomimimo.com/v1","aiModel":"mimo-v2.5-pro","allowedHosts":["ruanqiaoyun0-a11y.github.io","localhost","127.0.0.1"],"sections":[{"id":"s1","title":"续费底层逻辑与全流程总览","duration":"8-10分钟","icon":"1","type":"content_quiz","content":"\n<div class=\"section-header\">\n  <span class=\"section-badge\">第 1 章</span>\n  <h1>续费底层逻辑与全流程总览</h1>\n  <p class=\"duration\">⏱ 学习时长：8-10 分钟 ｜ 📝 含 3 道章节测验</p>\n</div>\n\n<div class=\"activate-box\">\n  <span class=\"at\">🔎 先想想你自己的经历</span>\n  你手上是不是有一个学员，课时快到期了，但你一直没敢开口谈续费？<br>\n  你担心的到底是「家长会拒绝」，还是「你自己不知道该从哪句话说起」？<br>\n  <strong>这一章先解决后一个问题——把整条路走通，你才敢开口。</strong>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">💰 先想清楚：家长为什么买，为什么续</h2>\n  <p>续费的本质是一次消费决策。家长不论理性还是冲动，决策的那一刻，心里都在算同一笔账：</p>\n  <div class=\"formula-box\">\n    <div class=\"formula-main\">性价比 ＝ <span class=\"frac\"><span class=\"num\">学习效果 × 服务质量</span><span class=\"den\">续费价格（教育投入）</span></span></div>\n  </div>\n  <div class=\"table-wrap\">\n    <table>\n      <thead><tr><th>变量</th><th>它由什么决定</th><th>你能做什么</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><strong>学习效果</strong></td>\n          <td>当下孩子学习的外化 ＋ 未来家长的期望</td>\n          <td>把进步「说出来、看得见」——这正是学情反馈的作用</td>\n        </tr>\n        <tr>\n          <td><strong>服务质量</strong></td>\n          <td>教学质量 ＋ 与班主任的粘合度</td>\n          <td>让家长感受到「想他所想，急他所需」</td>\n        </tr>\n        <tr>\n          <td><strong>续费价格</strong></td>\n          <td>公司政策的支撑</td>\n          <td>讲清优惠是<strong>相对的、有限的、来之不易的</strong></td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n  <div class=\"tips-box\">💡 <strong>关键认知：</strong>家长不是嫌贵，是觉得「不值」。你的任务不是降价，而是把分子做大——让学习效果和服务质量被看见。分子做大了，同样的价格就显得便宜。</div>\n</div>\n\n<div class=\"video-wrapper\">\n  <div class=\"video-label\">🎬 视频讲解：性价比公式与续费五步全景</div>\n  <video controls preload=\"metadata\" playsinline webkit-playsinline><source src=\"ch1_v1.mp4\" type=\"video/mp4\"></video>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🧭 续费五步流程（主线骨架）</h2>\n  <p style=\"margin-bottom:16px;\">这五步是整节课的脊柱。后面每一章，都是把这五步里的某一步讲透。</p>\n  <div class=\"flow-steps\">\n    <div class=\"flow-step\">\n      <div class=\"step-num\">1</div>\n      <h4>学情反馈</h4>\n      <p>反馈近期专题与过往情况 → 细节外化进步 → 提出一个待提升点</p>\n    </div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-step\">\n      <div class=\"step-num\">2</div>\n      <h4>课程规划</h4>\n      <p>询问家长期望 → 从课程内容与能力角度做规划</p>\n    </div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-step\">\n      <div class=\"step-num\">3</div>\n      <h4>提出课包方案</h4>\n      <p>按课程规划推荐 1-2 个方案，介绍相关活动政策</p>\n    </div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-step\">\n      <div class=\"step-num\">4</div>\n      <h4>收单</h4>\n      <p>突出优惠，强调重要性、紧迫性、唯一性</p>\n    </div>\n  </div>\n  <div class=\"highlight-box\" style=\"margin-top:16px;\">🔁 <strong>第五步 · 异议处理贯穿全程</strong>——家长随时可能提出价格、时间、效果、班级人数等异议。它不是流程的某一步，而是<strong>每一步都可能触发的支线</strong>。处理完必须回到主线继续推进。</div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">📣 开学季六步口诀（口语版记忆锚）</h2>\n  <p style=\"margin-bottom:16px;\">五步流程是「结构化版本」，六步口诀是「说出口的版本」。开学季谈单时，脑子里跑的是这六句：</p>\n  <div class=\"mnemonic-flow\">\n    <div class=\"mn-item\"><span class=\"mn-i\">①</span><div class=\"mn-t\">先聊孩子</div><div class=\"mn-q\">「暑期宝贝整体学习怎么样？」</div></div>\n    <div class=\"mn-item\"><span class=\"mn-i\">②</span><div class=\"mn-t\">给判断</div><div class=\"mn-q\">「我看下来，宝贝目前最大的问题／优势是……」</div></div>\n    <div class=\"mn-item\"><span class=\"mn-i\">③</span><div class=\"mn-t\">抛规划</div><div class=\"mn-q\">「开学以后我比较建议这样安排……」</div></div>\n    <div class=\"mn-item\"><span class=\"mn-i\">④</span><div class=\"mn-t\">引活动</div><div class=\"mn-q\">「刚好现在是开学季提前购……」</div></div>\n    <div class=\"mn-item\"><span class=\"mn-i\">⑤</span><div class=\"mn-t\">做对比</div><div class=\"mn-q\">「既然确定继续学，现在规划和后面再安排，政策是不一样的。」</div></div>\n    <div class=\"mn-item mn-last\"><span class=\"mn-i\">⑥</span><div class=\"mn-t\">直接收口</div><div class=\"mn-q\">「那我按照这个方案帮您把活动名额锁下来？」</div></div>\n  </div>\n  <div class=\"table-wrap\" style=\"margin-top:18px;\">\n    <table>\n      <thead><tr><th>六步口诀</th><th>对应五步流程</th><th>作用</th></tr></thead>\n      <tbody>\n        <tr><td>① 先聊孩子</td><td>铺垫（流程之外）</td><td>破冰与关怀，避开直接谈钱</td></tr>\n        <tr><td>② 给判断</td><td>第一步 学情反馈（前半）</td><td>建立专业判断，让家长认可你的观察</td></tr>\n        <tr><td>③ 抛规划</td><td>第二步 课程规划</td><td>把「买课」转成「新学期安排」</td></tr>\n        <tr><td>④ 引活动</td><td>第三步 提出课包方案</td><td>引出开学季提前购政策</td></tr>\n        <tr><td>⑤ 做对比</td><td>第四步 收单</td><td>促单三维度：连续性 / 政策 / 省心</td></tr>\n        <tr><td>⑥ 直接收口</td><td>第四步 收单（落点）</td><td>抛出明确行动指令，不再重复介绍课程</td></tr>\n      </tbody>\n    </table>\n  </div>\n</div>\n\n<div class=\"video-wrapper\">\n  <div class=\"video-label\">🎬 视频讲解：开学季六步口诀怎么和五步流程对上</div>\n  <video controls preload=\"metadata\" playsinline webkit-playsinline><source src=\"ch1_v2.mp4\" type=\"video/mp4\"></video>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🎯 开学季核心原则</h2>\n  <div class=\"highlight-box success\">✅ <strong>先关怀，后业务。</strong>从孩子暑期学习情况和新学期安排切入，先建立专业判断，再自然引出开学季提前购政策。</div>\n  <div class=\"highlight-box\">💡 <strong>重点不是反复催促活动</strong>，而是帮助家长完成新学期学习规划，并理解「在确定继续学习的情况下，为什么现在规划更合适」。</div>\n  <div class=\"highlight-box danger\">🔴 <strong>红线 · 不要把活动放在开场。</strong>先聊孩子，再聊新学期规划，最后才引出开学季提前购。一上来就讲价格和活动，家长会立刻进入防御状态。</div>\n</div>\n\n<div class=\"reflect-box\">\n  <span class=\"rt\">📝 反思一下</span>\n  回想你最近一次续费沟通失败的经历：你是在五步流程的哪一步「掉出去」的？<br>\n  是第二步没做规划就跳到讲价格，还是第四步讲完就不敢收口？\n</div>\n"},{"id":"s2","title":"第一步：学情反馈与效果外化","duration":"15-18分钟","icon":"2","type":"content_quiz","content":"\n<div class=\"section-header\">\n  <span class=\"section-badge\">第 2 章</span>\n  <h1>第一步：学情反馈与效果外化</h1>\n  <p class=\"duration\">⏱ 学习时长：15-18 分钟 ｜ 📝 含 3 道章节测验</p>\n</div>\n\n<div class=\"activate-box\">\n  <span class=\"at\">🔎 先想想你自己的经历</span>\n  你跟家长说「宝贝最近进步很大」——家长心里想的是什么？<br>\n  「你这话跟谁都能说。」<br>\n  <strong>学情反馈的全部功夫，就在于把「进步很大」变成家长没法不信的细节。</strong>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">📋 学情反馈四要素</h2>\n  <p style=\"margin-bottom:16px;\">SOP 上写的是三件事，但完整的学情反馈其实是四步——最后一步最容易漏，而它恰恰是通向课程规划的桥。</p>\n  <div class=\"step-list\">\n    <div class=\"step-item\">\n      <div class=\"step-num-big\">1</div>\n      <div class=\"step-content\">\n        <h4>反馈近期学习的专题内容及过往学习情况</h4>\n        <p>说出具体专题名和这个专题到底在学什么，让家长感受到你<strong>真的在看他的孩子</strong>。</p>\n        <div class=\"script-tpl\">孩子最近学习了 <span class=\"var\">XX 专题</span>，第一个专题是《构建策略》，主要学习的是让孩子通过观察物体的轮廓特征、图案特征完成单个和组合物体的拼图，在此基础上继续学习用不同的平面图形完成铺路、使用有序的方法进行物体的拼装，<strong>重点培养的是孩子的空间想象力、有序思维和解决问题的能力</strong>，并巩固了对图形的基础认知。<br><br>第二个专题学习的是《观察推理》，主要学习的是联想推理、轨迹推理、顺序推理和因果推理，<strong>重点培养孩子对事件的分析以及推理能力、表述能力</strong>。</div>\n      </div>\n    </div>\n    <div class=\"step-item\">\n      <div class=\"step-num-big\">2</div>\n      <div class=\"step-content\">\n        <h4>通过细节描述学员的进步，效果外化</h4>\n        <p>这一步的关键词是<strong>「结合家长报名初衷」</strong>——家长当初为什么报，就要往那个方向外化。具体见下一张卡片的三大抓手。</p>\n      </div>\n    </div>\n    <div class=\"step-item\">\n      <div class=\"step-num-big\">3</div>\n      <div class=\"step-content\">\n        <h4>提出至少一个待提升点，并提出建议</h4>\n        <p>只夸不提问题，家长反而不信。但提问题要「<strong>发现问题 + 给出办法</strong>」成对出现，绝不能只丢问题。</p>\n      </div>\n    </div>\n    <div class=\"step-item\">\n      <div class=\"step-num-big\">4</div>\n      <div class=\"step-content\">\n        <h4>过渡到学习规划（先问家长的期望）</h4>\n        <p>不要自己直接讲规划，<strong>先问家长对新阶段有什么期望</strong>。家长说出来的期望，就是后面课程规划的靶子。</p>\n      </div>\n    </div>\n  </div>\n</div>\n\n<div class=\"video-wrapper\">\n  <div class=\"video-label\">🎬 视频讲解：学情反馈四要素与效果外化三大抓手</div>\n  <video controls preload=\"metadata\" playsinline webkit-playsinline><source src=\"ch2_v1.mp4\" type=\"video/mp4\"></video>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🔍 效果外化三大抓手</h2>\n  <p style=\"margin-bottom:16px;\">进步不能笼统地说。从这三个方向任选 1-2 个，说到具体细节，家长才会觉得「这是真的看了我孩子」。</p>\n\n  <div class=\"outer-card\">\n    <h3>抓手一 · 知识内容 ＋ 方法、能力</h3>\n    <p>走「<strong>起点困难 → 过程投入 → 结果变化 → 能力沉淀</strong>」的时间线，对比感就出来了。</p>\n    <div class=\"script-tpl\">老师反馈刚开始学习 <span class=\"var\">XX 知识</span> 的时候孩子在理解上还有些困难，但是经过<strong>课后练习和时间的消化</strong>，孩子在相应专题的自评上，结果还是非常不错的。而且也<strong>学会了用 XX 方法解决问题</strong>。老师说孩子的 <span class=\"var\">XX 思维</span> 有了很大的提升呢。</div>\n  </div>\n\n  <div class=\"outer-card\">\n    <h3>抓手二 · 学习习惯（四类可量化变化）</h3>\n    <div class=\"table-wrap\">\n      <table>\n        <thead><tr><th>观察角度</th><th>怎么外化</th></tr></thead>\n        <tbody>\n          <tr>\n            <td><strong>学习闭环数据变化</strong></td>\n            <td>呈现前后变化的某个闭环数据——<strong>预习 → 出席 → 课后复习巩固</strong></td>\n          </tr>\n          <tr>\n            <td><strong>积极性（兴趣）变化</strong></td>\n            <td>课堂配合度、回答问题的积极性；对比<strong>学习闭环数据前后变化</strong>（预习、出席、作业完成）；课后主动询问老师问题；从家长口中得到的反馈</td>\n          </tr>\n          <tr>\n            <td><strong>独立性的变化</strong></td>\n            <td>自己记住上课时间、独立上课、独立完成作业</td>\n          </tr>\n          <tr>\n            <td><strong>细心程度的变化</strong></td>\n            <td>从<strong>作业前后正确率对比</strong>来反映</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <div class=\"tips-box\">💡 学习习惯这一抓手的威力在于<strong>可量化</strong>。「正确率从 60% 升到 85%」比「孩子变细心了」有力十倍。</div>\n  </div>\n\n  <div class=\"outer-card\">\n    <h3>抓手三 · 课堂表现（三个观察面）</h3>\n    <div class=\"three-grid\">\n      <div class=\"tg-item\">\n        <div class=\"tg-h\">🗣 课堂表达情况</div>\n        <ul>\n          <li>是否敢于说话</li>\n          <li>回答问题的语言是否清晰</li>\n          <li>表达是否有条理和顺序</li>\n          <li>词语是否丰富</li>\n        </ul>\n      </div>\n      <div class=\"tg-item\">\n        <div class=\"tg-h\">🎯 上课专注度</div>\n        <ul>\n          <li>老师提问是否能立即回应</li>\n          <li>是否能跟上上课节奏</li>\n          <li>是否离开座位或东张西望</li>\n          <li>是否有小动作或做与课堂无关的事<br>（比如玩玩具、吃水果）</li>\n        </ul>\n      </div>\n      <div class=\"tg-item\">\n        <div class=\"tg-h\">📏 课堂规则意识</div>\n        <ul>\n          <li>主动发言先举手</li>\n          <li>坐姿端正</li>\n          <li>主动向老师问好</li>\n          <li>未轮到自己时不随意打断同学和老师</li>\n          <li>按时进入教室，不迟到不早退</li>\n        </ul>\n      </div>\n    </div>\n  </div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">👦 先判断孩子属于哪一种状态</h2>\n  <p style=\"margin-bottom:16px;\">同样是谈续费，面对不同类型的孩子，学情反馈的落点完全不同。先判断，再开口。</p>\n  <div class=\"table-wrap\">\n    <table>\n      <thead><tr><th>类型</th><th>判断依据</th><th>话术落点</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><strong>A · 表现优秀</strong></td>\n          <td>整体学习状态不错，某个具体表现已经比较稳定</td>\n          <td>「我看宝贝最近整体学习状态还是不错的，尤其是【具体表现】这一块已经比较稳定了。所以这种孩子我反而<strong>不太建议只看眼前剩多少课</strong>，而是要把后面的学习节奏接起来。因为孩子现在已经形成学习状态了，<strong>新学期最怕的其实不是难，而是中间断掉以后又重新适应</strong>。」</td>\n        </tr>\n        <tr>\n          <td><strong>B · 表现平稳</strong></td>\n          <td>不算学得差，但【专注／计算／理解／思维方法】某一块还需要持续练</td>\n          <td>「孩子目前其实不算学得差，主要还是【专注／计算／理解／思维方法】这一块还需要持续练。这种情况下我更<strong>不建议把课程一段一段地看</strong>。思维训练本身就是一个持续积累的过程，前面刚练出来一点，后面如果间隔比较长，<strong>之前建立起来的感觉就容易慢慢掉</strong>。」</td>\n        </tr>\n        <tr>\n          <td><strong>C · 状态不稳定</strong></td>\n          <td>不是完全学不会，而是有时候状态特别好，有时候又明显掉下来</td>\n          <td>「我反而比较关注宝贝这一点。他不是完全学不会，而是有时候状态特别好，有时候又会明显掉下来。这种孩子<strong>最需要的其实不是突然加很多课，而是把学习节奏稳定下来</strong>。所以后面如果继续学，我更建议咱们<strong>提前把新学期的安排定下来</strong>，避免开学以后事情一多，课程反而被放到最后。」</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n</div>\n\n<div class=\"video-wrapper\">\n  <div class=\"video-label\">🎬 视频讲解：三种孩子状态的判断与过渡到规划的话术</div>\n  <video controls preload=\"metadata\" playsinline webkit-playsinline><source src=\"ch2_v2.mp4\" type=\"video/mp4\"></video>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🌉 提出待提升点 → 过渡到课程规划</h2>\n  <p style=\"margin-bottom:14px;\">这是第一步和第二步之间的桥。标准句式分三句：<strong>承认问题 → 给出办法 → 转向询问期望</strong>。</p>\n  <div class=\"script-tpl\">\n    <p><strong>① 承认问题：</strong>当然，孩子在过往这段时间的学习中也表现出有需要进步的地方，比如我们授课老师说孩子 <span class=\"var\">XXXX</span>（问题点也可以从效果外化的三个方面展开）。</p>\n    <p style=\"margin-top:10px;\"><strong>② 给出办法（关键：问题必须配办法）：</strong>不过妈妈不要太着急，老师和我既然发现了孩子的问题，就会想办法一起来帮助解决。比如课后妈妈可以 <span class=\"var\">XXXX</span>（提建议）。</p>\n    <p style=\"margin-top:10px;\"><strong>③ 转向询问期望：</strong>另外，结合我们刚刚说的孩子前一阶段已经达成的学习结果和现在存在的一些问题，我和老师对孩子后期的学习规划也有了一些想法。<strong>但我还是要先跟妈妈您了解一下，后面一个阶段您对孩子的学习期望是什么，或者说希望孩子在哪方面再做重点培养和提升？</strong></p>\n  </div>\n  <div class=\"highlight-box danger\">🔴 <strong>红线：</strong>不得贬低孩子，不得把问题归因于「孩子不认真／态度差」。要让家长感觉到你和他是<strong>同一战线</strong>，而不是你在给她列罪状。</div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🚫 学情反馈常见踩坑</h2>\n  <div class=\"table-wrap\">\n    <table>\n      <thead><tr><th>踩坑</th><th>为什么不行</th><th>怎么改</th></tr></thead>\n      <tbody>\n        <tr><td>「宝贝进步很大」（无细节）</td><td>跟谁都能说，家长无法验证，信任度为零</td><td>替换成具体专题 + 具体能力项 + 具体行为</td></tr>\n        <tr><td>只夸不提问题</td><td>家长会觉得你在推销，反而警惕</td><td>主动提 1 个待提升点，并配一个可执行建议</td></tr>\n        <tr><td>只提问题不给办法</td><td>制造焦虑却不解决，家长会烦躁</td><td>「不过妈妈不要太着急，老师和我发现了问题就会一起帮助解决」</td></tr>\n        <tr><td>提完问题直接讲价格</td><td>跳过了「问期望」，规划就没有靶子</td><td>先问：「后面一个阶段您对孩子的学习期望是什么？」</td></tr>\n      </tbody>\n    </table>\n  </div>\n</div>\n\n<div class=\"reflect-box\">\n  <span class=\"rt\">📝 反思一下</span>\n  挑一个你手上正在跟进的学员，试着用「四要素」完整说出他的学情反馈。<br>\n  你能说出他最近学的 <strong>具体专题名</strong> 吗？能说出一个<strong>可量化的变化</strong>吗？\n</div>\n"},{"id":"s3","title":"第二步：课程规划（S5/S6/S7 衔接）","duration":"18-22分钟","icon":"3","type":"content_quiz","content":"\n<div class=\"section-header\">\n  <span class=\"section-badge\">第 3 章</span>\n  <h1>第二步：课程规划——S5／S6／S7 三级衔接</h1>\n  <p class=\"duration\">⏱ 学习时长：18-22 分钟 ｜ 📝 含 3 道章节测验</p>\n</div>\n\n<div class=\"activate-box\">\n  <span class=\"at\">🔎 先想想你自己的经历</span>\n  家长问「那我们孩子后面到底学什么」，你能答得上来吗？<br>\n  如果你只能说出「接着往上学」，那你在家长心里就不是专业顾问，只是个催单的。<br>\n  <strong>这一章是本课的重心——把 S5、S6、S7 三级的卡点、能力和衔接关系讲透，你才敢做规划。</strong>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🪜 思维培养的三个阶段</h2>\n  <p style=\"margin-bottom:16px;\">先把全景讲清楚。思维培养是长期、系统化的过程，不是上一个学期就能见效的。</p>\n  <div class=\"stage-cards\">\n    <div class=\"stage-card\">\n      <div class=\"stage-tag\">第一阶段</div>\n      <h4>幼儿园阶段</h4>\n      <p>这个阶段孩子的思维比较<strong>具体</strong>，还处于思维初步启蒙的阶段。所以我们的课程主要是<strong>让孩子对思考有兴趣，愿意主动思考和探索</strong>。</p>\n    </div>\n    <div class=\"stage-card stage-hot\">\n      <div class=\"stage-tag\">第二阶段 · 最关键</div>\n      <h4>小学一至三年级（低年级）</h4>\n      <p>这个阶段孩子的<strong>抽象逻辑思维开始萌芽，也是思维的形成期，属于最关键的阶段</strong>。同时孩子要适应幼儿园升小学的转变，无论是学习模式还是评核制度都有变化。我们的课程会重点帮孩子<strong>从学习习惯和能力两方面做好衔接</strong>。</p>\n    </div>\n    <div class=\"stage-card\">\n      <div class=\"stage-tag\">第三阶段</div>\n      <h4>小学四至六年级（高年级）</h4>\n      <p>这个时期孩子的<strong>抽象逻辑思维已经初步建立，进入思维综合运用期</strong>。从课本内容都能明显感受到，不再是简单计算和问答，而是情境应用、多变式练习，需要孩子分析、理解，最后才列出算式计算，<strong>对孩子举一反三的能力要求很高</strong>。所以课程会重点培养<strong>归纳总结、综合运用和知识迁移</strong>的能力。</p>\n    </div>\n  </div>\n</div>\n\n<div class=\"video-wrapper\">\n  <div class=\"video-label\">🎬 视频讲解：思维培养三阶段与九阶体系定位</div>\n  <video controls preload=\"metadata\" playsinline webkit-playsinline><source src=\"ch3_v1.mp4\" type=\"video/mp4\"></video>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🎯 豌豆九阶课程体系 · 四个学段定位</h2>\n  <div class=\"table-wrap\">\n    <table>\n      <thead><tr><th>学段</th><th>级别</th><th>定位</th><th>关键词</th></tr></thead>\n      <tbody>\n        <tr><td>幼小衔接</td><td><strong>S1-S3</strong></td><td>夯实地基</td><td>建立数感与计算规范，突破乘除</td></tr>\n        <tr><td>低年级</td><td><strong>S4-S5</strong></td><td>拉开差距</td><td>突破多步策略与抽象建模</td></tr>\n        <tr class=\"tr-hot\"><td>中年级</td><td><strong>S6-S7</strong></td><td>冲刺满分</td><td>综合运用，严密逻辑，直击压轴</td></tr>\n        <tr><td>高年级</td><td><strong>S8-S9</strong></td><td>全面冲刺</td><td>系统规划，小升初目标清晰</td></tr>\n      </tbody>\n    </table>\n  </div>\n  <div class=\"tips-box\">💡 九阶体系是「螺旋式进阶」——每一级都在前面能力之上叠加。这句话是后面说服家长的基石：<strong>中断学习 = 知识点断层</strong>。</div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">⭐ S5 · 二年级 · 二年级的真正考验</h2>\n  <p class=\"lead-q\">为什么乘除一学就乱、两步题一做就错？</p>\n  <div class=\"level-block\">\n    <div class=\"lb-row\">\n      <div class=\"lb-tag\">定位</div>\n      <div class=\"lb-body\">从「加减思维」到「乘除思维」，从「一步列式」到「分步表达」，从「做完就行」到「做完会验」。<strong>稳稳渡过小学第一个真正意义上的难度分水岭。</strong></div>\n    </div>\n    <div class=\"lb-row\">\n      <div class=\"lb-tag\">最容易卡在哪</div>\n      <div class=\"lb-body\">\n        <div class=\"table-wrap\">\n          <table>\n            <thead><tr><th>家长常见误判</th><th>孩子表现</th><th>底层问题</th></tr></thead>\n            <tbody>\n              <tr>\n                <td>「口诀背了半年还卡壳，就是不用心」</td>\n                <td>乘法口诀顺口溜背得溜，换个顺序就不会，3×5 和 5×3 分不清楚</td>\n                <td><strong>乘法意义和数感没有建立。</strong>孩子不理解「几个几」的本质，只会单向顺口溜，不会双向灵活调用</td>\n              </tr>\n              <tr>\n                <td>「除法不就是乘法反过来吗，多练几道就好了」</td>\n                <td>看到「分」字就用除法，经常乘除混用，平均分和包含除分不清</td>\n                <td><strong>除法模型没有建立。</strong>两种除法情境不区分，只能靠字面猜运算</td>\n              </tr>\n              <tr>\n                <td>「两步题多读几遍就会了」</td>\n                <td>两步应用题读完题就发呆，根本不知道先算哪个</td>\n                <td><strong>中间问题提取能力未建立。</strong>缺少「先拆再算」的分步思维</td>\n              </tr>\n            </tbody>\n          </table>\n        </div>\n      </div>\n    </div>\n    <div class=\"lb-row\">\n      <div class=\"lb-tag\">本级能力建立</div>\n      <div class=\"lb-body\"><ul class=\"cap-list\">\n        <li>口诀更熟——能正着倒着灵活调用，计算题不再卡壳</li>\n        <li>题意更明——能找中间问题分步拆，两步题不瞎凑</li>\n        <li>关系更清——能画线段图析倍数关系，应用思路更清晰</li>\n        <li>过程更稳——能不跳步规范书写，做完会验算自纠</li>\n      </ul></div>\n    </div>\n    <div class=\"lb-row\">\n      <div class=\"lb-tag\">家长会看到的变化</div>\n      <div class=\"lb-body\"><ul class=\"cap-list chg\">\n        <li>计算题不再卡壳，乘除不再混用</li>\n        <li>两步应用题不再瞎凑，能说出先算什么</li>\n        <li>会主动画线段图理清倍数关系</li>\n        <li>做完会自己验算，不再等老师检查</li>\n      </ul></div>\n    </div>\n  </div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">⭐ S6 · 三年级 · 三年级的真正考验</h2>\n  <p class=\"lead-q\">为什么「突然就跟不上了」？</p>\n  <div class=\"level-block\">\n    <div class=\"lb-row\">\n      <div class=\"lb-tag\">定位</div>\n      <div class=\"lb-body\"><strong>小学第一道分水岭</strong>——分数登场、多位数乘除成为日常、应用题从两步骤跃升到三四步。很多孩子在这个阶段出现明显的成绩波动，家长归结为「孩子不认真」，但根源在于<strong>知识体系和思维方式的全面升级</strong>。孩子需要的不是更多刷题，而是系统性的思维工具升级。<br>从「具体数量」到「分数概念」，从「直来直往」到「多步策略」，从「算出答案」到「讲清逻辑」的三个跨越。</div>\n    </div>\n    <div class=\"lb-row\">\n      <div class=\"lb-tag\">最容易卡在哪</div>\n      <div class=\"lb-body\">\n        <div class=\"table-wrap\">\n          <table>\n            <thead><tr><th>家长常见误判</th><th>孩子表现</th><th>底层问题</th></tr></thead>\n            <tbody>\n              <tr>\n                <td>「分数就是上下两个数，画图看看就懂了」</td>\n                <td>分子分母搞反，比较大小总猜错，「几分之几」靠惯性做</td>\n                <td><strong>分数「份数」意义没建立。</strong>孩子不理解「整体与部分」的关系，只会按表面数字操作</td>\n              </tr>\n              <tr>\n                <td>「多位数乘除就是算得慢，多练练好了」</td>\n                <td>三位数 × 两位数算到一半就乱，除法竖式缺位漏位</td>\n                <td><strong>算理不清 ＋ 巧算策略缺失。</strong>只会机械套竖式，不懂位值和运算律的灵活运用</td>\n              </tr>\n              <tr>\n                <td>「应用题多读两遍就想出来了」</td>\n                <td>多步应用题直接空着，或者只做第一步就结束</td>\n                <td><strong>信息分层提取和策略规划没建立。</strong>多步题的难点在「中间问题链」，需要系统拆解方法</td>\n              </tr>\n            </tbody>\n          </table>\n        </div>\n      </div>\n    </div>\n    <div class=\"lb-row\">\n      <div class=\"lb-tag\">本级能力建立</div>\n      <div class=\"lb-body\"><ul class=\"cap-list\">\n        <li>概念更懂——能理解分数份数意义，概念题不靠猜</li>\n        <li>计算更巧——能灵活用巧算策略，多位数乘除拿满分</li>\n        <li>建模更清——能画问题链分步拆，多步题思路更清晰</li>\n        <li>思路更活——能假设列表破趣题，遇到新题有方法</li>\n        <li>会检查自纠——把粗心率降下来</li>\n      </ul></div>\n    </div>\n    <div class=\"lb-row\">\n      <div class=\"lb-tag\">家长会看到的变化</div>\n      <div class=\"lb-body\"><ul class=\"cap-list chg\">\n        <li>分数题不再靠猜，有理有据</li>\n        <li>多位数乘除计算正确率大幅提升</li>\n        <li>多步应用题能写出清晰步骤链</li>\n        <li>课堂会举手讲思路，自信心增强</li>\n      </ul></div>\n    </div>\n    <div class=\"lb-row lb-key\">\n      <div class=\"lb-tag\">🔑 说服家长的关键</div>\n      <div class=\"lb-body\">S6 处于<strong>中年级起点，是拉开差距的关键一年</strong>。分数概念和多步应用题的掌握程度，<strong>将直接决定四五年级能否持续保持优势</strong>，也是小升初拔高的必备地基。</div>\n    </div>\n  </div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">⭐ S7 · 四年级 · 四年级的真正考验</h2>\n  <p class=\"lead-q\">为什么「读懂题目却做不出来」？</p>\n  <div class=\"level-block\">\n    <div class=\"lb-row\">\n      <div class=\"lb-tag\">定位</div>\n      <div class=\"lb-body\"><strong>抽象思维转折点</strong>——亿以内大数登场、角度几何正式引入、相遇追及问题首次出现、小数乘除运算全面升级。很多孩子在这里出现「读得懂题但列不出式」的困境，家长焦虑地发现——<strong>刷题已经不管用了</strong>。问题的本质不是不努力，而是思维方式需要从「直觉型」升级为「建模型」。<br>从「看题就猜」到「画图建模」，从「单步直算」到「多步策略」，从「做了就行」到「做了必对」的三个跨越。</div>\n    </div>\n    <div class=\"lb-row\">\n      <div class=\"lb-tag\">最容易卡在哪</div>\n      <div class=\"lb-body\">\n        <div class=\"table-wrap\">\n          <table>\n            <thead><tr><th>家长常见误判</th><th>孩子表现</th><th>底层问题</th></tr></thead>\n            <tbody>\n              <tr>\n                <td>「大数不就是多几个零」</td>\n                <td>大数读写经常多零少零，四舍五入乱用</td>\n                <td><strong>位值概念没有结构化。</strong>孩子不理解「数级」和「数位」的分层逻辑，只会机械套规则</td>\n              </tr>\n              <tr>\n                <td>「相遇问题多读几遍画个图」</td>\n                <td>相遇追及读完题就懵，不知从哪画起</td>\n                <td><strong>等量关系提取能力没建立。</strong>不会把文字描述转化为「路程＝速度×时间」的标准模型</td>\n              </tr>\n              <tr>\n                <td>「小数不就是加个小数点」</td>\n                <td>小数乘除结果经常点错，运算律不会迁移</td>\n                <td><strong>小数运算的位值逻辑没打通。</strong>停留在「背规则」而非「理解为什么」，一变题型就乱</td>\n              </tr>\n            </tbody>\n          </table>\n        </div>\n      </div>\n    </div>\n    <div class=\"lb-row\">\n      <div class=\"lb-tag\">本级能力建立</div>\n      <div class=\"lb-body\"><ul class=\"cap-list\">\n        <li>拆解更清——大数与角度能分层拆，不混淆不串位</li>\n        <li>建模更活——行程相遇能画线段图，找得到等量关系</li>\n        <li>推导更准——内角和与三边关系能推导，不背公式</li>\n        <li>迁移更巧——整数运算律平滑移到小数，方法更灵活</li>\n      </ul></div>\n    </div>\n    <div class=\"lb-row\">\n      <div class=\"lb-tag\">家长会看到的变化</div>\n      <div class=\"lb-body\"><ul class=\"cap-list chg\">\n        <li>大数读写不再多零少零</li>\n        <li>相遇追及题能画图推导不再猜</li>\n        <li>小数乘除正确率大幅提升</li>\n        <li>面对陌生题型有建模思维不慌</li>\n      </ul></div>\n    </div>\n    <div class=\"lb-row lb-key\">\n      <div class=\"lb-tag\">🔑 说服家长的关键</div>\n      <div class=\"lb-body\">S7 是<strong>中年级的收官年</strong>，也是通向高年级综合应用的桥梁。这一年建立的行程模型、面积推导和运算策略，<strong>将直接决定五、六年级的几何压轴和分数复杂运算能否顺滑衔接</strong>。</div>\n    </div>\n  </div>\n</div>\n\n<div class=\"video-wrapper\">\n  <div class=\"video-label\">🎬 视频讲解：S5／S6／S7 三级卡点与衔接论证链</div>\n  <video controls preload=\"metadata\" playsinline webkit-playsinline><source src=\"ch3_v2.mp4\" type=\"video/mp4\"></video>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🔗 三级衔接论证链（本章收口，直接用于说服家长）</h2>\n  <div class=\"chain-box\">\n    <div class=\"chain-node\">\n      <div class=\"cn-h\">S5 · 二年级</div>\n      <div class=\"cn-s\">稳住计算与分步</div>\n      <div class=\"cn-d\">乘除体系</div>\n    </div>\n    <div class=\"chain-arrow\">→</div>\n    <div class=\"chain-node cn-hot\">\n      <div class=\"cn-h\">S6 · 三年级</div>\n      <div class=\"cn-s\">突破分数与多步策略</div>\n      <div class=\"cn-d\">分水岭</div>\n    </div>\n    <div class=\"chain-arrow\">→</div>\n    <div class=\"chain-node\">\n      <div class=\"cn-h\">S7 · 四年级</div>\n      <div class=\"cn-s\">建立抽象建模与推导</div>\n      <div class=\"cn-d\">转折点</div>\n    </div>\n  </div>\n  <div class=\"table-wrap\" style=\"margin-top:18px;\">\n    <table>\n      <thead><tr><th>如果这一级没学好</th><th>后果会传导到哪里</th></tr></thead>\n      <tbody>\n        <tr><td><strong>S5 乘除意义不清</strong></td><td>S6 的多位数乘除和分数运算全部受影响——地基歪了，楼就起不高</td></tr>\n        <tr><td><strong>S6 分数意义和多步拆解没建立</strong></td><td>S7 的小数乘除和面积周长会很吃力——分水岭没站稳，后面步步吃力</td></tr>\n        <tr><td><strong>S7 行程模型和建模思维没建立</strong></td><td>S8 方程建模、S9 综合压轴会出现断层——桥梁断了，高年级接不上</td></tr>\n      </tbody>\n    </table>\n  </div>\n  <div class=\"highlight-box warning\">⚠️ <strong>这套论证链是整节课最有说服力的部分。</strong>它不是「我们课程很好」，而是「如果你现在停，会具体损失什么」。家长对损失比对收益敏感得多。</div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🛠 从待提升点介绍后续学习重点和解决方案</h2>\n  <p style=\"margin-bottom:14px;\">规划不能只讲课程，要对着第 2 章提出的「待提升点」逐条回应。三个方向：</p>\n  <div class=\"table-wrap\">\n    <table>\n      <thead><tr><th>待提升点方向</th><th>怎么讲</th><th>配合方</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><strong>知识内容 ＋ 方法、能力</strong></td>\n          <td>结合学员薄弱项，告知未来将要学习的巩固和完善</td>\n          <td>课程本身</td>\n        </tr>\n        <tr>\n          <td><strong>学习习惯</strong></td>\n          <td>结合产品提出建议</td>\n          <td><strong>班导、老师、家长三方配合</strong></td>\n        </tr>\n        <tr>\n          <td><strong>课堂表现</strong></td>\n          <td>结合产品提出建议</td>\n          <td><strong>班导、老师、家长三方配合</strong></td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n  <div class=\"tips-box\">💡 然后再<strong>结合家长对孩子新一阶段的期望</strong>介绍课程规划。可以顺势问：「您想提高哪方面的能力呢？对目前教学内容是否满意呢？」</div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🗣 规划话术模板（可直接套用）</h2>\n  <div class=\"script-tpl\">\n    <p><strong>① 讲体系：</strong>其实思维培养是一个长期、系统化的过程。豌豆有一套完善的九阶课程体系，会配合不同年龄段孩子的认知特征来设计课程内容，保证给到孩子科学且体系化的思维培养方案。</p>\n    <p style=\"margin-top:10px;\"><strong>② 落到具体级别：</strong>以 <span class=\"var\">S6</span> 为例——我们小朋友现在已经成功升上豌豆 S6 级别课程，处于<strong>思维的形成期</strong>，说得通俗点就是打基础的关键阶段。这个阶段还有 <span class=\"var\">S7</span> 阶段课程，会帮孩子巩固基础，同时也是 <span class=\"var\">（衔接说明）</span>，为小朋友做好更充足的准备。基础打稳之后，后期到了思维综合运用期，孩子就可以很快掌握思维方法和素质，提升思维能力。</p>\n    <p style=\"margin-top:10px;\"><strong>③ 结论：</strong>所以现在正是孩子学习思维最关键的时期。</p>\n  </div>\n  <p style=\"margin-top:16px;margin-bottom:12px;\"><strong>规划收口可以给两个计划</strong>（给选择，不给压力）：</p>\n  <div class=\"script-tpl\">\n    <p>所以就目前来说，我对于小朋友有 2 个计划：</p>\n    <p style=\"margin-top:8px;\">一是我们给孩子规划到 <span class=\"var\">S7</span> 的课程，把思维培养的这个关键阶段学习完整，同时还能帮孩子提前做好准备，这样到了下一阶段孩子能很快适应到学习方式的变化，从而更容易获得信心，实现好的良性循环。</p>\n    <p style=\"margin-top:8px;\">另外就是规划到现在 <span class=\"var\">S6</span> 级别学习结束，至少让孩子把现在的内容学习完整。<strong>（当前级别）是整个思维培养关键阶段最要紧的一环，肯定不能中断。</strong></p>\n  </div>\n  <div class=\"highlight-box danger\">🔴 <strong>红线：</strong>不得承诺未授权的政策与价格；不得贬低竞品。</div>\n</div>\n\n<div class=\"reflect-box\">\n  <span class=\"rt\">📝 反思一下</span>\n  假设你手上有一个三年级学员，家长说「三年级作业变多了，怕孩子顾不过来」。<br>\n  用本章的 S6 卡点分析，你能说出<strong>三年级具体难在哪三个地方</strong>吗？你能用「三级衔接论证链」回应「顾不过来」这个顾虑吗？\n</div>\n"},{"id":"s4","title":"第三步课包方案 + 第四步推单收单","duration":"15-18分钟","icon":"4","type":"content_quiz","content":"\n<div class=\"section-header\">\n  <span class=\"section-badge\">第 4 章</span>\n  <h1>第三步课包方案 ＋ 第四步推单收单</h1>\n  <p class=\"duration\">⏱ 学习时长：15-18 分钟 ｜ 📝 含 6 道章节测验</p>\n</div>\n\n<div class=\"activate-box\">\n  <span class=\"at\">🔎 先想想你自己的经历</span>\n  你讲完规划，家长说「好的我了解了」——然后就没有然后了。<br>\n  问题往往出在：<strong>你没有把「规划」变成「两个具体的数字」。</strong><br>\n  这一章解决的是从「讲清楚」到「收得回来」。\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🧮 第三步 · 先算课时账，再谈方案</h2>\n  <p style=\"margin-bottom:14px;\">不要一上来就给方案。先把「还剩多少、能学到哪、学完要多少」这三个数字摆出来，家长的决策才有参照物。</p>\n  <div class=\"script-tpl\">我们现在还剩余 <span class=\"var\">XX</span> 课时，目前还可以学习到 <span class=\"var\">XX</span> 月份；如果是把 <span class=\"var\">S6</span> 级别学习完还需要 <span class=\"var\">XX</span> 课时；如果妈妈想让孩子长期去学习，其实规划到 <span class=\"var\">S7</span> 也不算长，把 <span class=\"var\">S7</span> 学习完我们是需要 <span class=\"var\">XX</span> 课时。</div>\n  <div class=\"highlight-box warning\">⚠️ 这一段的数字<strong>必须真实、必须算准</strong>。课时账是后面所有说服的基础，报错一个数字，整套规划的信任度就没了。</div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">📦 给两个方案（不是给一个）</h2>\n  <div class=\"two-plans\">\n    <div class=\"plan-card plan-a\">\n      <div class=\"plan-h\">方案一 · 长期方案</div>\n      <div class=\"plan-tag\">课时多 · 总价高 · 单价低</div>\n      <div class=\"plan-body\">\n        <p>把<strong>赠送的课时、豌豆币、打卡次数</strong>等有效赠送算给家长看，并且把<strong>优惠单价</strong>突出、<strong>学习周期</strong>突出。</p>\n        <div class=\"plan-tip\">落点：让家长感受到「一次性规划更划算、更省心」</div>\n      </div>\n    </div>\n    <div class=\"plan-card plan-b\">\n      <div class=\"plan-h\">方案二 · 短期方案</div>\n      <div class=\"plan-tag\">课时少 · 总价低 · 单价高一些</div>\n      <div class=\"plan-body\">\n        <p>同样把<strong>赠送的课时、豌豆币、打卡次数</strong>等有效赠送算给家长看，可以突出<strong>报名时的差价对比</strong>。</p>\n        <div class=\"plan-tip\">落点：守住「至少把当前级别学完整」这条底线</div>\n      </div>\n    </div>\n  </div>\n  <div class=\"script-tpl\" style=\"margin-top:18px;\"><strong>试探（把选择权交给家长）：</strong>妈妈您是更加倾向于学习到 <span class=\"var\">S7</span> 结束还是 <span class=\"var\">S6</span> 结束呢？／您更倾向长期还是短期呢？</div>\n  <div class=\"highlight-box\">💡 <strong>此时家长大概率会提出异议</strong>——价格、时间、要和爸爸商量。不要慌，这正是进入第五步的信号，按《异议处理》的方法解决即可（见第 5 章）。</div>\n</div>\n\n<div class=\"video-wrapper\">\n  <div class=\"video-label\">🎬 视频讲解：课时账怎么算，方案怎么给，推单两张牌怎么打</div>\n  <video controls preload=\"metadata\" playsinline webkit-playsinline><source src=\"ch4_v1.mp4\" type=\"video/mp4\"></video>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🗡 第四步 · 推单的两张牌</h2>\n  <p style=\"margin-bottom:16px;\">当家长再次犹豫时，用这两张牌——一张打「值不值」，一张打「该不该」。</p>\n\n  <div class=\"persuade-card\">\n    <div class=\"pc-head\"><span class=\"pc-num\">牌 1</span><h4>性价比（紧迫性）</h4></div>\n    <p class=\"pc-logic\">逻辑：先探预算与期望 → 抛出「今天确定可申请额外优惠」→ 把总价折算成单价和月供 → 类比日常消费。</p>\n    <div class=\"script-tpl\">妈妈您目前主要考虑的是总价还是单价呢？有没有预算呀？或者是小朋友想学到什么程度呢？<strong>如果今天可以确定报名，我可以再向经理申请一下额外优惠。</strong><br><br><span class=\"var\">XXX</span> 元您买的不仅是方案里的 <span class=\"var\">X</span> 堂课，还可以额外获得 <span class=\"var\">XX</span> 堂录播课、<span class=\"var\">XX</span> 豌豆币（相当于 <span class=\"var\">X</span> 堂课），加上小朋友学习期间所有的跟进服务和课后答疑都包含在内了，最终实实在在地提升孩子的思维能力。<br><br>我帮您算一下，现在<strong>每节课才 XX 多元，一个月也就 XXX 元</strong>，真的很划算。一家人出去吃一顿饭，就够小朋友一个月的学费了，您说是吧？我们的课程是玩中学，培养小朋友兴趣之余又学到知识，一举两得多好呀。</div>\n    <div class=\"pc-key\"><strong>落地技巧：</strong>课时 + 录播课 + 豌豆币 → 折算成「每节课单价」→ 再摊到「每个月多少钱」→ 类比一顿饭。</div>\n  </div>\n\n  <div class=\"persuade-card\">\n    <div class=\"pc-head\"><span class=\"pc-num\">牌 2</span><h4>理念（重要性）</h4></div>\n    <p class=\"pc-logic\">逻辑：承认「再便宜没效果也不会买」→ 转到思维培养必须持续学 → 用 AI 时代做长期价值锚定。</p>\n    <div class=\"script-tpl\">当然啦，再便宜的东西如果没有效果，肯定是不会买的。但思维学习这件事，<strong>一定要持续学</strong>，因为思维能力的培养会直接反映在孩子的学习中，提升他的思维上限，进步空间才会无可限量。<br><br>再者妈妈要知道，科技发展越来越快，小朋友出来工作起码是二十年后，那时候的科技发展你根本想象不到。现在很多行业、岗位，二十年后很大机会被 AI 取代而消失，所以<strong>不管孩子学哪个领域，只有思维能力永远不会被淘汰，是终身受用的核心能力</strong>。<br><br>而且小朋友一直学得很好，也很有兴趣，<strong>早一点规划就是帮他订立有效目标，为将来铺路</strong>，今天我们就帮小朋友确定下来吧。</div>\n    <div class=\"pc-key\"><strong>注意：</strong>这段是「理念教育」，不是「催单」。语气要笃定但不施压——它在抬高家长对这件事的认知，而不是在逼她做决定。</div>\n  </div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🎯 促单三维度（开学季补充）</h2>\n  <p style=\"margin-bottom:14px;\">开学季专用的三个切入角度，和上面两张牌配合使用。</p>\n  <div class=\"table-wrap\">\n    <table>\n      <thead><tr><th>维度</th><th>角度</th><th>核心话术</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><strong>学习连续性</strong></td>\n          <td>专业</td>\n          <td>「妈妈，我比较建议您这次不要只从『还剩多少课』去考虑。因为思维课不是学完一部分就结束了，<strong>它是前面的能力不断往后叠加</strong>。如果孩子确定要继续学，我更希望您把后面一个完整阶段规划下来。这样孩子不用每隔几个月重新考虑一次，学习节奏也会稳定很多。」</td>\n        </tr>\n        <tr>\n          <td><strong>活动政策</strong></td>\n          <td>利益</td>\n          <td>「您应该知道，教育机构每年活动力度最大的时候就是开学季，我们也是为了保证生源，所以提前针对老学员抛出了开学季的优惠，<strong>首轮补贴是力度最大的</strong>，无论是价格还是课时都是最多。现在属于活动期，所以如果本身就确定孩子后面还会继续学，现在规划和后面临时再买，<strong>实际享受到的政策是不一样的</strong>。」</td>\n        </tr>\n        <tr>\n          <td><strong>省心与安排</strong></td>\n          <td>家长</td>\n          <td>「妈妈，其实我从家长角度也比较建议一次规划好。因为您如果每次只安排一小段，过几个月又要重新考虑一次：还要不要学、什么时候买、有没有活动、时间怎么安排。这些事情其实挺琐碎的。<strong>如果咱们已经确定宝贝后面会继续学，那这次直接把后面的学习规划好，您反而省心</strong>。后面我主要帮您盯孩子的学习情况和学习进度就可以了。」</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">💳 带付话术与支付方式</h2>\n  <p style=\"margin-bottom:12px;\"><strong>带付话术（把「了解方案」推到「完成付款」）：</strong></p>\n  <div class=\"script-tpl\">既然小朋友打算长期持续学习，刚好现在有超划算的限时优惠，<strong>我马上把报名链接传给您，一步步带您完成缴费流程</strong>。等您缴费完成后，麻烦截图传给我，我会立刻给小朋友登记，所有赠品与专属优惠都会一并帮您兑换好。</div>\n\n  <p style=\"margin-top:20px;margin-bottom:12px;\"><strong>支付方式：</strong></p>\n  <div class=\"table-wrap\">\n    <table>\n      <thead><tr><th>方式</th><th>要点</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><strong>官方链接支付</strong></td>\n          <td>在 LP 工作台 → 学员详情页 → 续费里，按照与家长的沟通选择相应的续费课时包，复制链接发给家长。<br><strong>该链接 24 小时内支付有效</strong>，支持银联支付、微信、支付宝、花呗等。</td>\n        </tr>\n        <tr>\n          <td><strong>其它付款方式</strong></td>\n          <td>对公转账 · 京东／淘宝官方合作 · 花呗分期（免息）</td>\n        </tr>\n        <tr>\n          <td><strong>付款后必做</strong></td>\n          <td>LP 需<strong>在后台核对新增课时及相应赠送内容是否到账</strong>，并告知家长确认结果。</td>\n        </tr>\n        <tr>\n          <td><strong>合同与发票</strong></td>\n          <td>电子合同在家长端 APP「我」里面查看；电子发票若家长有需要，LP 在工作台【审批申请】处提交申请。</td>\n        </tr>\n        <tr>\n          <td><strong>续费确认表</strong></td>\n          <td>发送条件：家长付款后自动触发；<strong>时效：每周日截止</strong>，质检勘误。<strong>若未发送，会触发质检扣罚。</strong></td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n  <div class=\"highlight-box danger\">🔴 <strong>最容易漏的一步：</strong>付款完成后核对到账。很多同学收完钱就以为结束了——如果赠送内容没到账而你没告知，投诉就来了。</div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">⚠️ 收单注意事项五条</h2>\n  <div class=\"attn-list\">\n    <div class=\"attn-item\"><span class=\"attn-n\">1</span><div><strong>优惠不要一次性全部给出去，保留底牌。</strong>一次让完，后面就没有谈判空间了。</div></div>\n    <div class=\"attn-item\"><span class=\"attn-n\">2</span><div><strong>设置优惠节点，可设名额限制。</strong>让优惠有「时效」和「稀缺」，家长才有决策压力。</div></div>\n    <div class=\"attn-item\"><span class=\"attn-n\">3</span><div><strong>若家长说要考虑，约定再次跟进的时间。</strong>不要让沟通停在「我再想想」。</div></div>\n    <div class=\"attn-item\"><span class=\"attn-n\">4</span><div><strong>不论续不续，最终结语落脚在学习上，突出服务。</strong>今天没成，关系还在；结语一落脚在钱上，下次就很难开口了。</div></div>\n    <div class=\"attn-item\"><span class=\"attn-n\">5</span><div><strong>若非电话中直接付款，要说明支付时效，并持续跟进。</strong>链接 24 小时有效，过期要重新发。</div></div>\n  </div>\n</div>\n\n<div class=\"reflect-box\">\n  <span class=\"rt\">📝 反思一下</span>\n  你最近一次收单失败，是因为方案没给够两个、课时账没算清、还是收口的时候不敢抛出行动指令？<br>\n  下次沟通前，先把你手上的课时账手算一遍。\n</div>\n"},{"id":"s5","title":"第五步：异议处理","duration":"15-18分钟","icon":"5","type":"content_quiz","content":"\n<div class=\"section-header\">\n  <span class=\"section-badge\">第 5 章</span>\n  <h1>第五步：异议处理——从理解共情到理念强化</h1>\n  <p class=\"duration\">⏱ 学习时长：15-18 分钟 ｜ 📝 含 3 道章节测验</p>\n</div>\n\n<div class=\"activate-box\">\n  <span class=\"at\">🔎 先想想你自己的经历</span>\n  家长说「我再考虑一下」的时候，你的第一反应是什么？<br>\n  大部分人第一反应是「那我再给您讲讲」。<br>\n  <strong>而这句话，恰恰是最容易把对话聊死的一句。</strong>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🧭 异议处理四大核心方向</h2>\n  <p style=\"margin-bottom:16px;\">围绕「<strong>理解共情 — 挖掘根源 — 精准破局 — 理念强化</strong>」四个方向推进，确保异议处理<strong>既有温度又有力度</strong>。</p>\n  <div class=\"step-list\">\n    <div class=\"step-item\">\n      <div class=\"step-num-big\">1</div>\n      <div class=\"step-content\">\n        <h4>先共情，稳情绪</h4>\n        <p>对家长提出的异议（如价格、时间、效果、班级人数等）<strong>表示充分理解</strong>，缓和对立情绪，建立信任基础。</p>\n        <div class=\"quote-line\">⛔ 避免直接反驳——直接反驳会导致沟通中断。家长情绪没稳住之前，你讲的道理她都听不进去。</div>\n      </div>\n    </div>\n    <div class=\"step-item\">\n      <div class=\"step-num-big\">2</div>\n      <div class=\"step-content\">\n        <h4>辨真假，找根源</h4>\n        <p>通过<strong>提问</strong>确认异议的真实性，挖掘家长的真实顾虑。</p>\n        <div class=\"quote-line\">验证问句示例：「若课时即将学完，您是否会考虑报名？」<br>常见错位：表面说「没时间」，实则担心效果；表面说「价格贵」，实则对服务有不满。</div>\n      </div>\n    </div>\n    <div class=\"step-item\">\n      <div class=\"step-num-big\">3</div>\n      <div class=\"step-content\">\n        <h4>针对性，给方案</h4>\n        <p>结合<strong>产品优势、课程体系、服务保障</strong>，针对不同异议给出具体可落地的解决方案，<strong>而非泛泛而谈</strong>。</p>\n      </div>\n    </div>\n    <div class=\"step-item\">\n      <div class=\"step-num-big\">4</div>\n      <div class=\"step-content\">\n        <h4>强认知，促决策</h4>\n        <p>通过<strong>理念教育</strong>强化家长对思维培养的重视，结合优惠政策、学习连续性等，推动家长做出续费决策。</p>\n      </div>\n    </div>\n  </div>\n</div>\n\n<div class=\"video-wrapper\">\n  <div class=\"video-label\">🎬 视频讲解：异议处理四步与三张说服牌</div>\n  <video controls mix playsinline webkit-playsinline><source src=\"ch5_v1.mp4\" type=\"video/mp4\"></video>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🃏 三张说服牌</h2>\n  <p style=\"margin-bottom:16px;\">异议处理不能靠临场发挥，要靠三张准备好的牌。听到异议，先想：该出哪张牌？</p>\n\n  <div class=\"persuade-card\">\n    <div class=\"pc-head\"><span class=\"pc-num\">牌 1</span><h4>重要性 —— 让家长认同「续费是必要的教育投入」</h4></div>\n    <p class=\"pc-logic\"><strong>核心逻辑：</strong>传递「思维培养的长期价值 ＋ 课程学习的连续性价值 ＋ 孩子成长的关键期价值」，让家长明白续费不是「额外开支」，而是「<strong>刚需投入</strong>」。</p>\n    <div class=\"table-wrap\">\n      <table>\n        <thead><tr><th>价值角度</th><th>话术方向</th></tr></thead>\n        <tbody>\n          <tr>\n            <td><strong>思维培养的底层价值</strong></td>\n            <td>数学思维是终身能力，直接影响孩子应对多步骤应用题、幼小／小初衔接的逻辑题型，还会提升校内写作业的效率。<strong>思维培养是长期的，还有滞后性</strong>，一定要持续学才会见效，中途停了的话，之前练的逻辑、表达能力会慢慢生疏，浪费了之前的投入。</td>\n          </tr>\n          <tr>\n            <td><strong>课程体系的完整性价值</strong></td>\n            <td>我们课程 S1-S9 是<strong>螺旋式进阶</strong>——比如 S4-S5 是基础巩固期（数感与计算规范、乘除体系），S6-S7 是抽象思维形成期（多步策略、推理题型）。如果中途中断学习，<strong>知识点会断层</strong>，之后再接回校内的内容就会跟不上，影响后续的准备。</td>\n          </tr>\n          <tr>\n            <td><strong>孩子成长的关键期价值</strong></td>\n            <td>结合孩子年龄——比如学前到小学过渡阶段、低年级思维形成期，这些都是<strong>升学的黄金准备期</strong>。错过了这个阶段再补，不仅孩子学得辛苦，<strong>成本还会高很多</strong>（比如后续要额外报补习班）。</td>\n          </tr>\n          <tr>\n            <td><strong>现有学习的沉淀价值</strong></td>\n            <td>回顾孩子的进步——比如之前不太会说分类逻辑，现在可以流利说出；课后练习的正确率从 60% 升到 85%；上课专注力比以前好。<strong>续费就是巩固这些成果，放弃的话之前的进步就会倒退，等于前功尽弃。</strong></td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n  </div>\n\n  <div class=\"persuade-card\">\n    <div class=\"pc-head\"><span class=\"pc-num\">牌 2</span><h4>紧迫性 —— 让家长感知「现在续费是最佳时机」</h4></div>\n    <p class=\"pc-logic\"><strong>核心逻辑：</strong>通过「时间窗口限制 ＋ 学习进度压力 ＋ 优惠时效约束」，打破家长「再等等」的拖延心态，推动即时决策。</p>\n    <div class=\"table-wrap\">\n      <table>\n        <thead><tr><th>角度</th><th>话术方向</th></tr></thead>\n        <tbody>\n          <tr>\n            <td><strong>学习进度的时间压力</strong></td>\n            <td>结合孩子剩余课时和校内进度：「现在还剩余 <span class=\"var\">XX</span> 节，只够学到 <span class=\"var\">XX</span> 单元，离完成这个级别还差 <span class=\"var\">XX</span> 节。<strong>不及时续费的话，学习会中断</strong>，之后再接回课程，要重新适应知识点，还会错过后续的预习进度。」</td>\n          </tr>\n          <tr>\n            <td><strong>优惠政策的时效限制</strong></td>\n            <td>针对关键期：「现在离 <span class=\"var\">XX</span> 只剩 <span class=\"var\">XX</span> 个月，现在续费可以通过课程练习提前适应学习节奏。<strong>错过这段时间，就没有足够时间准备，竞争力就会弱一截。</strong>」</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n  </div>\n\n  <div class=\"persuade-card\">\n    <div class=\"pc-head\"><span class=\"pc-num\">牌 3</span><h4>唯一性 —— 让家长相信「豌豆是不可替代的选择」</h4></div>\n    <p class=\"pc-logic\"><strong>核心逻辑：</strong>突出豌豆在课程、服务、师资、适配度上的独特优势，让家长明白「<strong>换机构会损失现有沉淀</strong>，而且难以找到更适配的方案」。</p>\n    <div class=\"table-wrap\">\n      <table>\n        <thead><tr><th>独特性</th><th>话术方向</th></tr></thead>\n        <tbody>\n          <tr>\n            <td><strong>课程产品的独特性</strong></td>\n            <td>强调本地适配和独特设计：「豌豆的课程有<strong>完整的中文班九阶课程体系</strong>，完全贴合校内教学方向，还融入 IP 和游戏化教学——其他思维机构，要么没有中文班，要么课程不贴近校内学习与衔接需求，<strong>这些优势是其他机构复制不了的</strong>。」</td>\n          </tr>\n          <tr>\n            <td><strong>服务保障的独特性</strong></td>\n            <td>对比其他机构：「豌豆有<strong>三师伴学</strong>（课前规划 ＋ 课中跟进 ＋ 课后反馈），还有专属学习群。很多辅导班都是 15 人以上大班，老师根本关注不到每个孩子，课后也没有及时的知识辅导，<strong>服务没有我们这么完整</strong>。」</td>\n          </tr>\n          <tr>\n            <td><strong>师生适配的独特性</strong></td>\n            <td>强调适配成本：「孩子现在已经习惯了这位老师的教学风格，也熟悉了课程里的练习模式。如果换机构，<strong>要重新适应新老师、新课件</strong>，还要重新对接知识点，浪费不少时间不说，学习效果也未必有现在这么好。」</td>\n          </tr>\n          <tr>\n            <td><strong>优惠福利的独特性</strong></td>\n            <td>强调当前续费可享受的专属福利（如赠课更多、打卡奖励更丰厚、豌豆币额外赠送）是「<strong>仅针对老学员的专属权益</strong>」，新学员或后续报名无法享受同等优惠。</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n  </div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🎒 开学季备用锦囊三问</h2>\n  <p style=\"margin-bottom:14px;\">这三句话最多人问，也最容易答错。记住应对的<strong>框架</strong>，别背句子。</p>\n\n  <div class=\"qa-card\">\n    <div class=\"qa-q\">Q1 ·「我先买少一点。」</div>\n    <div class=\"qa-a\">\n      <p>「可以的妈妈，我理解。其实如果您现在<strong>还没有确定</strong>孩子后面是不是继续学，我肯定不会建议您一下规划太多。</p>\n      <p>但如果您<strong>已经确定</strong>孩子后面会继续学，那我反而建议您把活动政策利用起来。因为我们现在讨论的不是『要不要给孩子学』，而是<strong>既然确定要学，什么时候规划更合适</strong>。这个区别还是挺大的。」</p>\n      <div class=\"qa-key\">🔑 框架：理解 → 区分「还没确定」与「已确定」→ 把问题从「要不要」换成「什么时候」</div>\n    </div>\n  </div>\n\n  <div class=\"qa-card\">\n    <div class=\"qa-q\">Q2 ·「我回去考虑一下。」</div>\n    <div class=\"qa-a\">\n      <p>「可以妈妈，您肯定要考虑一下。您主要就帮我看两个点：<strong>第一，孩子后面是不是确定继续学；第二，如果确定继续学，现在这个活动政策对您来说合不合适。</strong></p>\n      <p>这两个想清楚，其实方案就很好选了。我这边活动期间都可以帮您跟进。」</p>\n      <div class=\"qa-key\">🔑 框架：允许考虑 → 给两个明确的思考点 → 保留跟进接口（不要逼，但也不要断）</div>\n    </div>\n  </div>\n\n  <div class=\"qa-card\">\n    <div class=\"qa-q\">Q3 ·「现在不想一次花这么多。」</div>\n    <div class=\"qa-a\">\n      <p>「理解妈妈。所以我也<strong>不是单纯让您为了活动去买</strong>。如果孩子后面本身就准备继续学，那我们才考虑怎么利用这次活动；如果本身没有继续学习的计划，那就没必要为了优惠额外支出。</p>\n      <p>您可以先把方案看一下，我们按照宝贝实际情况来。」</p>\n      <div class=\"qa-key\">🔑 框架：理解 → 澄清「不是为活动买」→ 把决策权交回家长（反而更显真诚）</div>\n    </div>\n  </div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🚫 异议处理三条红线</h2>\n  <div class=\"highlight-box danger\">🔴 <strong>不直接反驳、不争辩、不施压。</strong>家长提出异议时，第一句话永远不是「不是这样的」，而是「我理解」。</div>\n  <div class=\"highlight-box danger\">🔴 <strong>不承诺未授权的政策与价格。</strong>具体权益以当期活动方案为准。可以强调「活动期与常规政策存在差异」，但不要自行承诺未确定的政策。</div>\n  <div class=\"highlight-box danger\">🔴 <strong>不贬低竞品。</strong>对比可以，贬低不行。贬低同行会让家长质疑你的专业度和格局。</div>\n</div>\n\n<div class=\"reflect-box\">\n  <span class=\"rt\">📝 反思一下</span>\n  家长说「三年级了作业变多，怕孩子顾不过来」——这可能是真顾虑，也可能是「不想续」的挡箭牌。<br>\n  你会用哪个问句来<strong>辨真假</strong>？听到这个异议，你准备先出哪张牌？\n</div>\n"},{"id":"s6","title":"学习反馈、复习引导与终极考核","duration":"15-20分钟","icon":"🏆","type":"content","content":"\n<div class=\"section-header\">\n  <span class=\"section-badge\">第 6 章</span>\n  <h1>学习反馈与复习引导 ＋ Role Play 备考</h1>\n  <p class=\"duration\">⏱ 学习时长：15-20 分钟 ｜ 🏆 含终极考核</p>\n</div>\n\n<div class=\"activate-box\">\n  <span class=\"at\">🔎 先想想你自己的经历</span>\n  家长问「老师，我们家孩子最近怎么样」——你会不会只能用「挺好的」「还不错」来回答？<br>\n  <strong>学习反馈的质量，直接决定家长对「服务质量」这一项的评分。</strong><br>\n  这一章给你一套可复用的反馈与复习引导体系，外加 S1-S9 九级速查库。\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">❓ 为什么学习反馈必须「对照级别」说</h2>\n  <p>家长听不懂「孩子进步了」这种笼统的话——因为这句话对谁都成立。</p>\n  <p style=\"margin-top:12px;\"><strong>有效反馈的前提是：你要说出这个级别对应的能力项。</strong>说得出「S6 这个级别要建立的是分数意义、多步拆解和巧算习惯，孩子现在分数意义已经通了」，家长才会觉得你是真的了解他孩子。</p>\n  <div class=\"highlight-box success\">✅ 级别找对了，反馈就有靶子；反馈有靶子，后面的课程规划才顺理成章。<strong>这是整节课前面所有内容的收口。</strong></div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🧩 学习反馈三段式模板</h2>\n  <p style=\"margin-bottom:16px;\">把第 2 章的四要素，和白皮书的级别能力项合并，就是一套可复用的模板：</p>\n  <div class=\"three-flow\">\n    <div class=\"tf-item\">\n      <div class=\"tf-n\">①</div>\n      <div class=\"tf-h\">反馈什么</div>\n      <div class=\"tf-b\">孩子最近学的<strong>专题</strong> ＋ 这个专题对应的<strong>级别能力项</strong><br><span class=\"tf-tip\">用九级速查库定位能力项</span></div>\n    </div>\n    <div class=\"tf-arrow\">→</div>\n    <div class=\"tf-item\">\n      <div class=\"tf-n\">②</div>\n      <div class=\"tf-h\">外化什么</div>\n      <div class=\"tf-b\">从「知识＋方法能力 ／ 学习习惯 ／ 课堂表现」<strong>三轴中选 1-2 个</strong>说具体细节<br><span class=\"tf-tip\">可量化 &gt; 形容词</span></div>\n    </div>\n    <div class=\"tf-arrow\">→</div>\n    <div class=\"tf-item\">\n      <div class=\"tf-n\">③</div>\n      <div class=\"tf-h\">提升什么</div>\n      <div class=\"tf-b\">对照该级别的<strong>「最容易卡在哪」，说出一个待提升点 ＋ 建议</strong><br><span class=\"tf-tip\">问题必须配办法</span></div>\n    </div>\n  </div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">📚 S1-S9 九级速查库</h2>\n  <p style=\"margin-bottom:16px;\">课后随时可按学员级别定位反馈话术。<strong>S5／S6／S7 为 ⭐ 重点级别</strong>，与第 3 章对应段落互相印证。点击卡片标题展开。</p>\n  <div id=\"levelLibrary\"></div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🎯 四段阶梯实战演练</h2>\n  <p style=\"margin-bottom:12px;\">把前面五章的能力串成一条线：<strong>学情反馈 → 课程规划＋课时账 → 推单包装优惠 → 异议处理</strong>。四段都配一位 AI 家长，你可以自由打字练习。</p>\n  <div class=\"highlight-box warning\">🧪 <strong>练习性质说明：</strong>本区为<strong>练习 · 不计入考核</strong>，随时可以做、也可以跳过，不影响章节解锁与结业证书。真正的考核在后面的「终极考核」。</div>\n  <div id=\"ch6ScenarioTabs\"></div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">✍️ 三轮话术写作练习</h2>\n  <p style=\"margin-bottom:16px;\">说得出，还要写得出。三道教写作题对应四段演练中的三个关键动作，写完即给分与复盘。<strong>同样不计入考核。</strong></p>\n  <div id=\"ch6WritingDrills\"></div>\n</div>\n\n<div class=\"video-wrapper\">\n  <div class=\"video-label\">🎬 视频讲解：学习反馈方法与复习引导</div>\n  <video controls preload=\"metadata\" playsinline webkit-playsinline><source src=\"ch6_v1.mp4\" type=\"video/mp4\"></video>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🎧 复习引导双引擎之一 · UPSC 答题闭环</h2>\n  <p style=\"margin-bottom:16px;\">这是豌豆课程从低年级起就贯穿的标准化答题闭环——把「不粗心」变成<strong>肌肉记忆</strong>。跟家长聊复习方法时，这就是你的主轴。</p>\n  <div class=\"upsc-grid\">\n    <div class=\"upsc-item\">\n      <div class=\"upsc-letter\">U</div>\n      <div class=\"upsc-h\">Understand · 深度理解</div>\n      <p>先读懂题，再动手。<strong>圈出数字、关键词和关系词</strong>，知道题目到底在问什么。</p>\n    </div>\n    <div class=\"upsc-item\">\n      <div class=\"upsc-letter\">P</div>\n      <div class=\"upsc-h\">Plan · 规划思路</div>\n      <p><strong>想关系、画图示、选方法</strong>，不急着写答案，先把思路理顺。</p>\n    </div>\n    <div class=\"upsc-item\">\n      <div class=\"upsc-letter\">S</div>\n      <div class=\"upsc-h\">Solve · 精准执行</div>\n      <p><strong>规范列式，步骤清楚，书写工整</strong>，把脑中的想法准确落到纸面上。</p>\n    </div>\n    <div class=\"upsc-item\">\n      <div class=\"upsc-letter\">C</div>\n      <div class=\"upsc-h\">Check · 复盘检查</div>\n      <p>做完不立刻结束，<strong>回头检查条件、过程和结果</strong>，逐步养成自我纠错的能力。</p>\n    </div>\n  </div>\n  <div class=\"highlight-box\" style=\"margin-top:18px;\">👶 <strong>低龄家长沟通版（S1-S3）</strong>：<strong>听懂指令</strong>（先听懂老师让我做什么）→ <strong>想好步骤</strong>（先看哪里，再看哪里）→ <strong>动手操作</strong>（按想好的顺序一步步做）→ <strong>看看对没</strong>（做完回头看一眼，有没有漏掉的地方）。<br><span style=\"font-size:13px;color:var(--text-secondary)\">三岁不是比谁认的数字多，而是比谁先爱上认真完成一件事的感觉。</span></div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🧹 复习引导双引擎之二 · 课后卡点清零三阶</h2>\n  <p style=\"margin-bottom:16px;\">家长最怕的一句是「校内错题没人讲，期末复习没头绪」。三阶清零就是你的答案。</p>\n  <div class=\"clear-cards\">\n    <div class=\"clear-card\">\n      <div class=\"cc-icon\">✨</div>\n      <div class=\"cc-h\">一阶 · 周周清</div>\n      <p>课堂和课后<strong>及时发现问题</strong>，不把卡点拖到考试前。</p>\n    </div>\n    <div class=\"clear-card\">\n      <div class=\"cc-icon\">🎙</div>\n      <div class=\"cc-h\">二阶 · 开口讲</div>\n      <p>孩子不只改答案，还会<strong>把正确思路重新讲一遍</strong>——讲得出来才是真懂。</p>\n    </div>\n    <div class=\"clear-card\">\n      <div class=\"cc-icon\">🎯</div>\n      <div class=\"cc-h\">三阶 · 考前清</div>\n      <p>围绕重点阶段做<strong>复盘和梳理</strong>，让孩子知道哪里该补、怎么补。</p>\n    </div>\n  </div>\n  <p style=\"margin-top:20px;margin-bottom:12px;\"><strong>每节课孩子都会经历的六步闭环：</strong></p>\n  <div class=\"six-closure\">\n    <div class=\"sc-item\"><span class=\"sc-n\">1</span>课前预热<div class=\"sc-d\">前置预习，知识回顾</div></div>\n    <div class=\"sc-item\"><span class=\"sc-n\">2</span>知识关<div class=\"sc-d\">学会校内／拓展／奥数考点</div></div>\n    <div class=\"sc-item\"><span class=\"sc-n\">3</span>思维关<div class=\"sc-d\">学会拆解方法与模型</div></div>\n    <div class=\"sc-item\"><span class=\"sc-n\">4</span>规范关<div class=\"sc-d\">实战练步骤和书写排版</div></div>\n    <div class=\"sc-item\"><span class=\"sc-n\">5</span>课后巩固<div class=\"sc-d\">及时查缺补漏，卡点清零</div></div>\n    <div class=\"sc-item\"><span class=\"sc-n\">6</span>阶段复盘<div class=\"sc-d\">阶段检测复习、考前冲刺</div></div>\n  </div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🗣 引导学员复习的标准话术（可直接说给家长听）</h2>\n  <div class=\"script-tpl\">妈妈，我们课后<strong>不是让孩子多刷题</strong>，而是走三步：<br><br><strong>周周清</strong>——当周的卡点当周清掉，不拖到考试前；<br><strong>开口讲</strong>——不只改答案，让孩子把正确思路重新讲一遍，讲得出来才是真懂；<br><strong>考前清</strong>——围绕重点做复盘，让孩子自己知道哪里该补、怎么补。<br><br>每一节课他都会走 <strong>U-P-S-C</strong> 这个闭环：先读懂题、再规划思路、然后规范列式、最后回头检查——<strong>把「不粗心」变成肌肉记忆</strong>。所以您在家不用盯着他刷题，帮着把这些习惯稳住就可以了。</div>\n  <div class=\"tips-box\">💡 这段话的价值在于「帮家长减负」。家长最怕的是「我要陪写作业」，而你告诉她「你不用刷题，帮我稳住习惯就行」——她要做的动作变小了，配合意愿反而变高了。</div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🏆 终极考核 · Role Play 背景</h2>\n  <p style=\"margin-bottom:16px;\">接下来你要进入实战认证。你将以<strong>班主任（LP）</strong>身份，与 AI 家长完成一整轮续费沟通。<strong>先看清背景，再点开始。</strong></p>\n\n  <div class=\"exam-paper\">\n    <div class=\"ep-title\">豌豆思维班主任续费实战认证（Role Play）</div>\n\n    <div class=\"ep-sec\">\n      <div class=\"ep-h\">一、学员信息</div>\n      <div class=\"table-wrap\">\n        <table>\n          <thead><tr><th>项目</th><th>内容</th></tr></thead>\n          <tbody>\n            <tr><td>学员姓名</td><td><strong>洋阳（男）</strong></td></tr>\n            <tr><td>9 月份开学年级</td><td><strong>三年级</strong></td></tr>\n            <tr><td>剩余课时</td><td><strong>28 节</strong></td></tr>\n            <tr><td>学习负责人</td><td>妈妈</td></tr>\n            <tr><td>付款决策人</td><td><strong>爸爸（负责付款）</strong></td></tr>\n          </tbody>\n        </table>\n      </div>\n    </div>\n\n    <div class=\"ep-sec\">\n      <div class=\"ep-h\">二、学员学习背景</div>\n      <p class=\"ep-body\">洋阳课堂状态不错，愿意互动，学习习惯较好，基础计算扎实，但<strong>分析、推理和表达能力还有提升空间</strong>。9 月份进入三年级后，<strong>学习难度提升，更需要提前做好学习衔接</strong>。</p>\n    </div>\n\n    <div class=\"ep-sec\">\n      <div class=\"ep-h\">三、考核任务</div>\n      <div class=\"task-checklist\">\n        <div class=\"tc-item\"><span class=\"tc-box\">☐</span>开场白、自我介绍</div>\n        <div class=\"tc-item\"><span class=\"tc-box\">☐</span>反馈孩子学习情况</div>\n        <div class=\"tc-item\"><span class=\"tc-box\">☐</span>分析三年级学习卡点</div>\n        <div class=\"tc-item\"><span class=\"tc-box\">☐</span>做好课程规划</div>\n        <div class=\"tc-item\"><span class=\"tc-box\">☐</span>包装优惠方案</div>\n        <div class=\"tc-item\"><span class=\"tc-box\">☐</span>成交推进</div>\n      </div>\n      <div class=\"highlight-box warning\" style=\"margin-top:14px;\">⚠️ 考核过程中，<strong>考核官将随机提出家长异议</strong>，请现场处理。</div>\n    </div>\n\n    <div class=\"ep-sec\">\n      <div class=\"ep-h\">四、备考提示（每项任务去哪复习）</div>\n      <div class=\"table-wrap\">\n        <table>\n          <thead><tr><th>考核任务</th><th>复习章节</th></tr></thead>\n          <tbody>\n            <tr><td>开场白、自我介绍</td><td>第 1 章 · 六步口诀 ① 先聊孩子</td></tr>\n            <tr><td>反馈孩子学习情况</td><td>第 2 章 · 学情反馈四要素 ＋ 效果外化三抓手</td></tr>\n            <tr><td>分析三年级学习卡点</td><td><strong>第 3 章 · S6 三年级三大卡点</strong> ＋ <strong>第 6 章 · 速查库 S6 卡片</strong></td></tr>\n            <tr><td>做好课程规划</td><td><strong>第 3 章 · 三级衔接论证链</strong> ＋ 第 4 章 · 课时账与两个方案</td></tr>\n            <tr><td>包装优惠方案</td><td>第 4 章 · 促单三维度 ＋ 带付话术</td></tr>\n            <tr><td>成交推进</td><td>第 4 章 · 推单两张牌 ＋ 第 5 章 · 异议处理四步</td></tr>\n            <tr><td>随机异议处理</td><td><strong>第 5 章 · 三张说服牌 ＋ 备用锦囊三问</strong></td></tr>\n          </tbody>\n        </table>\n      </div>\n    </div>\n  </div>\n</div>\n\n<div class=\"card\">\n  <h2 class=\"card-title\">🎬 终极考核 · 与 AI 家长自由对话</h2>\n  <p style=\"margin-bottom:8px;\">你是班主任（LP），现在给洋阳妈妈打电话谈续费。<strong>至少完成 4 轮对话</strong>后才可以结束并评分。</p>\n  <div class=\"tips-box\" style=\"margin-bottom:14px;\">💡 建议节奏：<strong>① 开场自我介绍 → ② 学情反馈 → ③ 三年级卡点 → ④ 课程规划 → ⑤ 课时账与方案 → ⑥ 包装优惠 → ⑦ 处理异议 → ⑧ 成交推进 → ⑨ 确认收尾</strong>。妈妈会随时提出异议，记得先共情再给方案。</div>\n  <div id=\"roleplayContainer\"></div>\n</div>\n\n<div class=\"reflect-box\">\n  <span class=\"rt\">📝 考前最后一遍</span>\n  闭上眼把六步口诀跑一遍：先聊孩子 → 给判断 → 抛规划 → 引活动 → 做对比 → 直接收口。<br>\n  再想想：洋阳是三年级，三年级的第一道分水岭难在哪三件事？<strong>想清楚了，就点开始。</strong>\n</div>\n"}],"chapterQuizzes":[[{"q":"家长说「你们这个价格有点贵」。按性价比公式，最有效的应对方向是？","opts":["直接申请折扣，把价格降下来","把学习效果和服务质量讲清楚、摆出来，让家长看到分子足够大","告诉家长别家机构更贵，我们算便宜的","先不提价格，换个话题继续聊"],"correct":1,"feedback_correct":"✅ 对。性价比 ＝（学习效果 × 服务质量）÷ 续费价格。家长嫌贵时，多数情况不是嫌价格高，而是没看见分子。把效果和服务讲透，比降价有效得多。","feedback_wrong":"❌ 再想想性价比公式。降价是动分母，空间有限且伤利润；把分母「显得小」的正解，是把分子做大。贬低同行更是红线。建议回顾第 1 章「性价比公式」。"},{"q":"开学季谈单正确的开场方式是哪一种？","opts":["直接告诉家长「现在是开学季，优惠力度最大，赶紧报名」","先问「孩子暑期学得怎么样」，从学习情况和新学期安排切入","先发活动海报，让家长自己看政策","先问家长「孩子后面还学不学」"],"correct":1,"feedback_correct":"✅ 对。核心原则是「先关怀后业务」。从孩子暑期学习情况和新学期安排切入，先建立专业判断，再自然引出活动政策。","feedback_wrong":"❌ 这几项都踩了同一个坑——把业务放在了关怀前面。活动不能放开场；反复问「还学不学」会逼家长防御。建议回顾第 1 章「开学季核心原则」。"},{"q":"关于「异议处理」在续费流程中的位置，正确的是？","opts":["它是第五步，处理完流程就结束了","它只在收单环节才会出现","它贯穿全程，每一步都可能触发，处理完必须回到主线继续推进","它属于售后环节，和续费谈单无关"],"correct":2,"feedback_correct":"✅ 对。异议处理不是流程的某一步，而是每一步都可能触发的支线。很多同学卡在「处理完就停了」，忘了回到主线往前走——这是最常见的失分点。","feedback_wrong":"❌ 异议处理并非流程的第五步。它贯穿全程，家长在学情反馈、课程规划、讲价格时都可能提异议，处理完必须回到主线。建议回顾第 1 章「续费五步流程」。"}],[{"q":"家长当初报名时最在意「孩子上课不敢表达」。做效果外化时，最应该往哪个方向说明进步？","opts":["孩子的计算速度变快了","孩子的课堂表达从不敢说到能说清、有条理、词语更丰富","孩子的出勤率一直很稳定","孩子的作业正确率提升了"],"correct":1,"feedback_correct":"✅ 对。效果外化的关键词是「结合家长报名初衷」。家长当初为什么报，就要往那个方向外化——报名时在意表达，就要讲课堂表达的变化。","feedback_wrong":"❌ 其他几项都是真实变化，但没有对准家长的报名初衷。效果外化的核心是「结合家长报名初衷」，家长在意什么就说透什么。建议回顾第 2 章「效果外化三大抓手」。"},{"q":"关于「提出待提升点」，哪种处理是对的？","opts":["只说优点，不提问题，避免家长担心","把孩子的所有问题一次全部列给家长看","提出一个待提升点，同时给出具体建议，并说明老师和你一起帮忙解决","提问题时暗示是家长配合不到位"],"correct":2,"feedback_correct":"✅ 对。「发现问题 + 给出办法」必须成对出现，并且要让家长感觉到你和她是同一战线。提完问题就该转向询问家长对新阶段的期望。","feedback_wrong":"❌ 只夸不提家长不信；全列出来是施压；暗示家长不配合会直接破坏关系。正确做法是提出一个待提升点 + 具体建议 + 表明一起解决。建议回顾第 2 章「过渡到课程规划」。"},{"q":"「学习习惯」这一抓手里，最有力的外化方式是什么？","opts":["说「孩子学习习惯变好了」","说「孩子现在懂事多了」","呈现可量化的前后对比，比如作业正确率从 60% 升到 85%","说「老师都觉得孩子习惯不错」"],"correct":2,"feedback_correct":"✅ 对。学习习惯这一抓手的威力在于可量化。具体数据（预习-出席-课后复习的闭环数据、作业前后正确率对比）比形容词有力十倍。","feedback_wrong":"❌ 其余选项都是形容词或转述，家长无法验证。学习习惯要靠「学习闭环数据变化、正确率前后对比」这类可量化证据来说。建议回顾第 2 章「抓手二 · 学习习惯」。"}],[{"q":"家长说「三年级了，孩子成绩突然就掉下来了，是不是不认真？」正确的专业解读是？","opts":["确实是态度问题，建议家长多盯着孩子做作业","三年级是小学第一道分水岭——分数登场、多位数乘除成为日常、应用题从两步跃升到三四步，根源是知识体系和思维方式的全面升级","题目变难了，多刷题就能补回来","孩子还没开窍，等大一点自然就好了"],"correct":1,"feedback_correct":"✅ 对。归因于「不认真」是家长最常见的误判。真正的根源是分数意义、多步拆解策略和巧算习惯这三件事没有同时打牢。孩子需要的不是更多刷题，而是系统性的思维工具升级。","feedback_wrong":"❌ 归因于态度或让家长「多刷题」，都是白皮书明确点出的家长常见误判。「等大一点」更会错过关键期。建议回顾第 3 章「S6 · 三年级的真正考验」。"},{"q":"按照三级衔接论证链，如果 S6 的分数意义和多步拆解没有建立，会直接影响到？","opts":["只影响三年级期末考试成绩","影响 S7 的小数乘除和面积周长学习，进而影响 S8 方程建模与 S9 综合压轴","没有影响，四年级会重新讲一遍","只影响计算速度，不影响理解能力"],"correct":1,"feedback_correct":"✅ 对。九阶体系是螺旋式进阶，每一级都在前一级能力之上叠加。S6 没站稳 → S7 吃力 → S8／S9 断层。这条传导链是说服家长最有力的工具。","feedback_wrong":"❌ 不要低估传导效应。九阶课程是螺旋式进阶，前一阶段的能力是后一阶段的地基。建议回顾第 3 章「三级衔接论证链」。"},{"q":"做完课程规划后，正确的收口方式是？","opts":["直接告诉家长「所以您应该报名 S7」","给出两个计划（规划到下一级 / 至少把当前级别学完整），说明「当前级别是关键阶段不能中断」","把九阶体系全部讲一遍，让家长自己选","先回去准备一份详细的课程表，下次再聊"],"correct":1,"feedback_correct":"✅ 对。给两个计划是「给选择，不给压力」——长期方案显得有诚意，短期方案守住底线，两个都指向「不能中断当前级别」。","feedback_wrong":"❌ 单方案显得强硬；全讲一遍会让家长信息过载；回去准备课程表则错失了当下的沟通节奏。建议回顾第 3 章「规划话术模板」。"}],[{"q":"给家长做课包方案的顺序，正确的是？","opts":["直接报价，让家长选便宜的","先算课时账（还剩多少、能学到哪、学完要多少），再给长期／短期两个方案，最后试探倾向","先把所有方案列成表格发给家长，让他自己研究","先讲优惠力度，再讲课时"],"correct":1,"feedback_correct":"✅ 对。课时账是家长决策的参照物。先算账 → 给两个方案（长期／短期）→ 试探倾向。顺序颠倒会让家长无从比较。","feedback_wrong":"❌ 直接报价或先讲优惠，都缺少参照物，家长无法判断值不值。正确顺序是：算课时账 → 给两个方案 → 试探倾向。建议回顾第 4 章「先算课时账」。"},{"q":"关于「优惠不要一次性全部给出去」，正确的理解是？","opts":["要故意压着优惠不给，让家长着急","保留底牌，并设置优惠节点与名额限制，让优惠有时效感和稀缺感","优惠要分批给，每次家长问就放一点","这条已经过时了，现在应该一次给到位"],"correct":1,"feedback_correct":"✅ 对。保留底牌不是耍手段，而是让优惠有「时效」和「稀缺」，家长才有决策压力。配合设置优惠节点与名额限制一起用。","feedback_wrong":"❌ 故意吊胃口或家长一问就放一点，都会让家长觉得你在套路她，反而伤害信任。正确做法是保留底牌 + 设置优惠节点和名额限制。建议回顾第 4 章「收单注意事项五条」。"},{"q":"家长付款完成后，LP 必须做的一件事是？","opts":["立即发送续费确认表并结束沟通","在后台核对新增课时及相应的赠送内容是否到账，并告知家长确认结果","等系统自动处理，一周后再看","把付款截图转发给经理备案"],"correct":1,"feedback_correct":"✅ 对。付款不等于结束。必须在后台核对新增课时和赠送内容是否到账，并主动告知家长确认结果——这是最容易漏、也最容易引发投诉的一步。","feedback_wrong":"❌ 付款完成后仍有必做动作：核对新增课时与赠送内容是否到账，并告知家长确认结果。漏掉这一步，赠送没到账就会变成投诉。建议回顾第 4 章「带付话术与支付方式」。"},{"q":"带付话术的第一步，你要主动做什么？","opts":["让家长自己去工作台找缴费入口","把报名链接主动传给家长","只发一条文字报价单","引导家长去对公转账页面"],"correct":1,"feedback_correct":"✅ 对。带付话术第一步就是「我马上把报名链接传给您」——主动把官方链接送到家长手上，别让家长自己找。","feedback_wrong":"❌ 正确动作是把报名链接主动传给家长，而不是让家长自己找入口或改走其它渠道。建议回顾第 4 章「带付话术」第一句。"},{"q":"话术里承诺「一步步带您完成」的是哪件事？","opts":["帮家长重新挑选课时包","帮家长申请额外的折扣","带家长完成整个缴费流程","替家长直接完成支付"],"correct":2,"feedback_correct":"✅ 对。家长对自助操作常有畏难情绪，所以要承诺「一步步带您完成缴费流程」，降低操作门槛。","feedback_wrong":"❌ 这句承诺的对象是缴费流程本身——「一步步带您完成缴费流程」。挑包、砍价、代付都不是话术里的承诺。建议回顾第 4 章「带付话术」。"},{"q":"家长缴费完成后，你要求他马上做什么，以便你立刻登记和兑换赠品？","opts":["等系统自动通知就行","把课程表截图发给你","不用做任何事","把缴费截图传给你"],"correct":3,"feedback_correct":"✅ 对。「麻烦截图传给我，我会立刻给小朋友登记，赠品与专属优惠一并兑换好」——截图是你要立刻办理登记的凭证。","feedback_wrong":"❌ 正确动作是请家长把缴费截图传给你——有了凭证你才能立刻登记并兑换赠品。建议回顾第 4 章「带付话术」最后一句。"}],[{"q":"家长说「我再考虑一下」。按异议处理四步，你的第一反应应该是？","opts":["立刻再讲一遍课程优势，加深印象","先共情认同，再通过提问辨真假、找根源","直接申请额外优惠，用利益留住家长","尊重家长，礼貌告别并等家长主动联系"],"correct":1,"feedback_correct":"✅ 对。四步的第一步永远是「先共情，稳情绪」。急着再讲一遍或立刻放优惠，都属于跳步——家长情绪没稳住，讲什么都听不进去。","feedback_wrong":"❌ 急着讲优势是「直接反驳」的近亲；立刻放优惠会伤害后面的谈判空间；礼貌告别则等于放弃跟进。正确第一步是先共情，再用提问辨真假、找根源。建议回顾第 5 章「异议处理四大核心方向」。"},{"q":"家长说「没时间，最近太忙了」。属于「辨真假，找根源」的做法是？","opts":["接受这个理由，约下周再聊","告诉家长「时间可以协调，我们能排课」","用提问验证真实性，比如「如果时间不是问题，您会考虑让孩子继续学吗？」","强调别的家长也很忙，但都在坚持学"],"correct":2,"feedback_correct":"✅ 对。「没时间」经常是表层理由——真实顾虑可能是效果、价格，或者对服务不满。要用提问把真实顾虑挖出来，而不是停在字面。","feedback_wrong":"❌ 直接接受或直接给解决方案，都停留在字面意思上。辨真假的核心是「通过提问确认异议真实性」，比如「若课时即将学完，您是否会考虑报名？」建议回顾第 5 章「辨真假，找根源」。"},{"q":"家长说「孩子现在学得挺好，先学完这学期再说」。最该出哪张牌？","opts":["唯一性——强调豌豆不可替代","紧迫性——强调优惠马上结束","重要性——讲思维培养的长期价值与课程连续性，说明中断会导致知识点断层、之前的进步倒退","直接给折扣，用利益打动"],"correct":2,"feedback_correct":"✅ 对。这类异议的根源是「没意识到中断的代价」，所以要出「重要性」牌——把续费从「额外开支」重新定义为「刚需投入」，重点讲课程体系的连续性价值和现有学习的沉淀价值。","feedback_wrong":"❌ 家长此刻的顾虑是「要不要现在续」，而不是「要不要选豌豆」。出唯一性或紧迫性牌都不对症。该出的是「重要性」牌，讲清中断的代价。建议回顾第 5 章「三张说服牌」。"}],[]],"levelLibrary":[{"level":"S1","grade":"小班 · 3-4 岁","hot":false,"position":"数感萌芽、图形初识、专注力萌芽的黄金期。重点不是「学会多少知识」，而是帮孩子在游戏体验中建立对数和形的初步感知，建立<strong>愿意学、坐得住、听得进</strong>的基础习惯。","stuck":[["「现在还小，等大了自然就会了」","数到 10 跳数，指 3 个苹果说 5 个","数感和一一对应能力未建立，需要「手口一致点数」的具象经验堆积"],["「图形不就是圆的方的嘛」","正方形斜放不认识，三角梯形混淆","图形特征抽象识别未形成，需要大量多角度多形态的图形观察"],["「专注是性格问题，大点会好的」","讲 3 分钟就开始东摸西摸","任务理解和执行功能在发展中，需要从短时游戏逐步拉长专注时长"]],"build":["手口一致点数，感知数与量","识别基本图形及其特征","建立有序观察习惯","听懂指令并持续完成任务"],"change":["能准确点数 5-10 个物品","能说图形名并找生活实例","看图不跳行跳格，顺序清楚","坐得住 5-10 分钟，主动参与"]},{"level":"S2","grade":"中班 · 4-5 岁","hot":false,"position":"从「凭感觉」到「有方法」。不是提前教小学内容，而是帮孩子建立「<strong>我能自己想</strong>」的信心和「一步一步来」的方法感。","stuck":[["「加减法教了好多遍还不会」","知 1+2=3，换情境问「再给几个变 5 个」就答不出","数量关系直觉未建立，需在大量操作中感知「总数＝部分＋部分」"],["「搭积木挺厉害，看图做题就不行」","拼图对但说不清为什么，换摆法就不认识","空间推理层未打开，需从「动手试」过渡到「先想再试」"],["「会的题挺好，不会的就发呆」","做完等老师，从不主动尝试不同方法","元认知——对自己思考过程的觉察未形成，需建立多策略意识"]],"build":["感知数关系，用自己的方法解加减","用图形拼切搭构建空间想象","按顺序完成多步任务","遇难题愿意换个方法再试"],"change":["会用「凑」或「分」来算加减","复杂图案能分析怎么拼不试错","会说「我先做这个再做那个」","不再一不会就放弃，主动尝试"]},{"level":"S3","grade":"大班 · 5-6 岁","hot":false,"position":"幼小衔接的冲刺期，也是逻辑推理和综合思维能力的爆发期。关键不是「抢跑知识」，而是把「<strong>会思考、能表达、坐得住</strong>」三样底层能力准备好。","stuck":[["「提前把一年级学一遍就万事大吉」","靠记忆会做简单加减，一变情境就不会","「记步骤」和「懂算理」的区别——幼小衔接核心不是知识量而是思维深度"],["「孩子挺聪明，就是不爱说为什么」","能答对但说不清为什么，写不出步骤","「逻辑表达」未打通，从「心里明白」到「能说清楚」需专门训练"],["「上课专注是老师的事」","在家能做很久，一到集体环境就分心","「任务理解＋规则切换」能力不足，需在模拟课堂中适应"]],"build":["独立完成多条件推理","有条理地说出思考过程","理解加减的算理与意义","运用策略解决计算应用问题","建立学习习惯适应课堂节奏"],"change":["能独立完成多条件推理","能有条理地说出思考过程","能自信独立完成学习任务","入学后能快速适应课堂节奏"]},{"level":"S4","grade":"一年级","hot":false,"position":"数学学习起跑阶段：把<strong>理解力、方法感、规范感</strong>同时打牢，让「会做题」变成「会学习」。完成「从听懂到读懂、从直觉作答到按步骤解题、从做完就停到做完会检查」的三个跨越。","stuck":[["「孩子就是粗心」","看错符号、漏题、算得慢","算理不清 ＋ 审题流程不稳定，还没有形成规范的读题和检查习惯"],["「多刷几道题就好了」","会做熟题，一变题就乱","只会记结果、不会想过程，缺少画图、拆解、建模等方法"],["「等长大一点会了」","应用题加减混用，附加题直接空","信息提取和逻辑表达能力没有及时建立，这个阶段不补会持续影响校内成绩和学习自信"]],"build":["懂算理，形成稳定数感","会读题，能提取关键信息","会画图，能把文字转成关系","会检查，把正确率稳住"],"change":["校内基础题更稳，少丢冤枉分","应用题更容易读懂，不再瞎凑数","在课堂更有自信，更愿意开口讲思路","后面学中高年级内容时，更能举一反三"]},{"level":"S5","grade":"二年级","hot":true,"position":"从「加减思维」到「乘除思维」，从「一步列式」到「分步表达」，从「做完就行」到「做完会验」。<strong>稳稳渡过小学第一个真正意义上的难度分水岭。</strong>","stuck":[["「口诀背了半年还卡壳，就是不用心」","乘法口诀顺口溜背得溜，换个顺序就不会，3×5 和 5×3 分不清楚","乘法意义和数感没有建立，只会单向顺口溜，不会双向灵活调用"],["「除法不就是乘法反过来吗」","看到「分」字就用除法，经常乘除混用，平均分和包含除分不清","除法模型没有建立，两种除法情境不区分，只能靠字面猜运算"],["「两步题多读几遍就会了」","两步应用题读完题就发呆，根本不知道先算哪个","中间问题提取能力未建立，缺少「先拆再算」的分步思维"]],"build":["口诀更熟——正着倒着灵活调用，计算题不再卡壳","题意更明——能找中间问题分步拆，两步题不瞎凑","关系更清——能画线段图析倍数关系，应用思路更清晰","过程更稳——能不跳步规范书写，做完会验算自纠"],"change":["计算题不再卡壳，乘除不再混用","两步应用题不再瞎凑，能说出先算什么","会主动画线段图理清倍数关系","做完会自己验算，不再等老师检查"]},{"level":"S6","grade":"三年级","hot":true,"position":"<strong>小学第一道分水岭</strong>——分数登场、多位数乘除成为日常、应用题从两步骤跃升到三四步。从「具体数量」到「分数概念」，从「直来直往」到「多步策略」，从「算出答案」到「讲清逻辑」。让「勉强跟上」变成「游刃有余」。","stuck":[["「分数就是上下两个数，画图看看就懂了」","分子分母搞反，比较大小总猜错，「几分之几」靠惯性做","<strong>分数「份数」意义没建立</strong>，孩子不理解「整体与部分」的关系，只会按表面数字操作"],["「多位数乘除就是算得慢，多练练好了」","三位数 × 两位数算到一半就乱，除法竖式缺位漏位","<strong>算理不清 ＋ 巧算策略缺失</strong>，只会机械套竖式，不懂位值和运算律的灵活运用"],["「应用题多读两遍就想出来了」","多步应用题直接空着，或者只做第一步就结束","<strong>信息分层提取和策略规划没建立</strong>，多步题的难点在「中间问题链」"]],"build":["概念更懂——能理解分数份数意义，概念题不靠猜","计算更巧——能灵活用巧算策略，多位数乘除拿满分","建模更清——能画问题链分步拆，多步题思路更清晰","思路更活——能假设列表破趣题，遇到新题有方法","会检查自纠——把粗心率降下来"],"change":["分数题不再靠猜，有理有据","多位数乘除计算正确率大幅提升","多步应用题能写出清晰步骤链","课堂会举手讲思路，自信心增强"]},{"level":"S7","grade":"四年级","hot":true,"position":"<strong>抽象思维转折点</strong>——亿以内大数登场、角度几何正式引入、相遇追及问题首次出现、小数乘除运算全面升级。从「看题就猜」到「画图建模」，从「单步直算」到「多步策略」，从「做了就行」到「做了必对」。让「读完题就懵」变成「画完图就解」。","stuck":[["「大数不就是多几个零」","大数读写经常多零少零，四舍五入乱用","<strong>位值概念没有结构化</strong>，孩子不理解「数级」和「数位」的分层逻辑，只会机械套规则"],["「相遇问题多读几遍画个图」","相遇追及读完题就懵，不知从哪画起","<strong>等量关系提取能力没建立</strong>，不会把文字描述转化为「路程＝速度×时间」的标准模型"],["「小数不就是加个小数点」","小数乘除结果经常点错，运算律不会迁移","<strong>小数运算的位值逻辑没打通</strong>，停留在「背规则」而非「理解为什么」"]],"build":["拆解更清——大数与角度能分层拆，不混淆不串位","建模更活——行程相遇能画线段图，找得到等量关系","推导更准——内角和与三边关系能推导，不背公式","迁移更巧——整数运算律平滑移到小数，方法更灵活"],"change":["大数读写不再多零少零","相遇追及题能画图推导不再猜","小数乘除正确率大幅提升","面对陌生题型有建模思维不慌"]},{"level":"S8","grade":"五年级","hot":false,"position":"<strong>代数化拐点</strong>——分数的加减乘除全面展开、方程正式登场、平面图形面积计算需要灵活用策略而非套公式。从「按步骤套」到「理解推导」，从「算术直算」到「代数建模」，从「会做熟题」到「会解新题」。让「套公式」升级为「懂推导」。","stuck":[["「分数的约分通分多练就好了」","分数加减经常算错，约分不彻底，通分找错公倍数","<strong>因倍质合基础没打透</strong>——分数运算的核心在因倍关系，不是机械套步骤"],["「方程就是 x 代替问号换个写法」","设不来未知数，等量关系找不准，解完不会检验","<strong>代数建模思维没建立</strong>，不会把文字关系转化为等式，无法从算术跨越到代数"],["「面积公式背熟套进去就行」","标准图形会用公式，稍加变化就懵，割补容斥不会选","<strong>策略选择能力缺失</strong>——需要建立「看图形特征→选策略」的决策能力"]],"build":["数感更深——因倍质合探得到底，分数运算有根基","建模更巧——方程有标准流程，列解检验不跳步","策略更活——割补容斥会选会用，复杂图形拆得开","分析更透——多对象行程层层拆解，复杂情境有底气"],"change":["分数运算算理清晰，不再机械套步骤","方程能规范设未知数、列等式、解完检验","复杂图形会主动选割补或容斥策略","面对多对象行程题有底气"]},{"level":"S9","grade":"六年级","hot":false,"position":"小学收官年，所有知识在此交汇——分数百分数比例、几何模型的综合运用、浓度行程经济等跨模块应用题。从「会做单章题」到「会解综合题」，从「被动套模型」到「主动选策略」，从「能做完」到「能做对做全」。","stuck":[["「六年级内容不多，主要是复习」","圆和扇形面积计算老错，曲边图形不知从何入手","<strong>「新学＋同步综合」的双重压力被低估</strong>——六年级上还有圆、百分数、比等大量新知识"],["「几何模型记下来套就行」","鸟头蝴蝶燕尾模型知道但不会 ame":"性价比折算","key":"性价比","max":30},{"name":"紧迫性营造","key":"紧迫","max":25},{"name":"理念价值","key":"理念","max":25},{"name":"收口明确度","key":"收口","max":20}]},{"id":"sc4","tab":"④ 异议处理","title":"场景四 · 接住两个真实顾虑","setup":"沟通进行到一半，<strong>妈妈提出两个具体顾虑</strong>：一是<strong>「三年级作业变多，怕孩子顾不过来」</strong>，二是<strong>「这么大的事得跟洋阳爸爸商量一下」</strong>。你的任务是：走<strong>异议处理四步</strong>——先共情稳情绪、再用提问辨真假、然后针对性给方案、最后回到主线继续推进。<strong>注意：不得直接反驳，不得贬低孩子，不得施压。</strong>","persona_name":"洋阳妈妈","min_rounds":4,"system_prompt":"你扮演「洋阳妈妈」，中国大陆家长，儿子洋阳 9 月上三年级，正在上豌豆思维 S6 级别课程，剩余 28 课时。班主任（LP）正在跟你谈续费，你心里有两个明确的顾虑。请用自然的中文口语回复，语气贴近中国大陆家长（可以说「宝贝」「我们家孩子」「我这边」「挺担心的」等），每次 30-80 字。\n\n洋阳背景：\n- 9 岁男孩，中国大陆，今年 9 月上小学三年级\n- 豌豆思维 S6 级别在读；课堂状态不错，愿意互动\n- 学习习惯较好，基础计算扎实\n- 但分析、推理和表达能力还有提升空间\n- 剩余 28 课时\n- 妈妈负责孩子的学习安排；爸爸是付款决策人，但工作忙，基本不参与孩子的学习\n\n你此刻的状态（重要）：\n- 你心里有两个**真实顾虑**：\n  ① **三年级了作业一下子变多，我怕孩子顾不过来**\n  ② **价格有点贵，而且这事我想跟洋阳爸爸商量一下**（爸爸是付款人，但他平时不管学习）\n- 你会主动把这两个顾虑说出来，而且可能一轮里同时提\n- 如果老师**直接反驳**你（比如「不会的，我们时间很灵活」「不用商量了」），你会明显冷淡甚至抗拒\n- 如果老师**先共情**、再**用提问确认你到底担心什么**，你会愿意多说一些自己的真实想法\n- 如果老师能**针对你的顾虑给出具体安排**（比如时间怎么排、怎么帮孩子减负、怎么让爸爸了解情况），你会比较认可\n- 如果老师一直催你「今天定下来」，你会不舒服\n\n对话规则：\n1. 只回复你说的话，不要自我介绍，也不要复述场景\n2. 每回合回复要有信息量，不可以只是「嗯」「好」「我再想想」\n3. 如果班主任的话术让你不舒服，你会表达抗拒或者冷淡\n4. 你可能在一轮里混合提出多个异议\n5. 不要主动结束对话，等待班主任推进\n\n开始场景：班主任正在跟你电话沟通，你已经接起电话，请说第一句：「喂，老师。说实话我挺担心的，三年级作业一下子多了好多，我怕他顾不过来；而且这个钱也不少，我还得跟他爸商量商量。」","topic_tags":[{"name":"共情认同","kw":["理解","明白","确实","您说得对","我懂","换我我也会","不着急","顾虑","体谅"]},{"name":"辨真假提问","kw":["主要是担心","具体是","如果","那您","方便说一下","我了解一下","是担心","还是"]},{"name":"针对时间顾虑给方案","kw":["时间","排课","调整","周末","固定","提前定下来","节奏","安排"]},{"name":"针对商量给方案","kw":["爸爸","商量","谁最了解","规划者","一起了解","发给他","学习群","不关注"]},{"name":"回主线推进","kw":["所以","那我们就","接下来","帮您","先","这样安排","下一步"]}],"fallback_replies":[[["理解","明白","确实","我懂","顾虑","不着急"],"你能理解就好。主要是我真的怕他忙不过来。"],[["主要是担心","具体是","如果","那你","我了解一下"],"我主要担心就是他时间不够，别的倒还好。"],[["时间","排课","调整","周末","节奏","安排"],"那时间上你们能怎么安排呢？总不能天天让他熬夜吧。"],[["爸爸","商量","谁最了解","规划者","一起了解","发给他"],"他爸平时不太管孩子学习，但这么大的开销我得跟他说一声。"],[["所以","那我们就","接下来","帮您","下一步"],"那你说下一步怎么办吧。"]],"scoring_prompt":"你是一位资深的少儿数学思维培训机构班主任（LP）培训评分官。请根据以下 LP 与家长「洋阳妈妈」的**异议处理**对话，从四个维度评分（满分 100）：\n\n1. 共情先行（25 分）：面对异议，第一反应是否是**先共情认同**，而不是直接反驳、解释或施压。出现「不是这样的」「不会的」等直接反驳，该项大幅扣分。\n2. 辨真假提问（25 分）：是否**通过提问确认顾虑的真实性**（如「您是担心时间排不开，还是担心孩子太累？」），而不是停在字面意思上。\n3. 针对性方案（30 分）：是否针对**「作业多顾不过来」**和**「要和爸爸商量」**两个具体顾虑，分别给出可落地的安排（排课建议、谁来规划、怎么让爸爸了解情况）。\n4. 主线闭环（20 分）：异议处理完之后，是否**回到沟通主线继续推进**（推进到课时账／方案／下一步动作），而不是处理完就停了。\n\n评分要求：先在心里逐句分析再给分。识别语义而非字面对照。额外注意：**不得贬低孩子、不得把问题归因于孩子不认真、不得贬低竞品**，违反的应在对应维度扣分并在点评中明确指出。\n\n请只返回如下 JSON 格式，不要有任何其他文字：\n{\"score\": 78, \"breakdown\": {\"共情\": 20, \"辨真\": 19, \"方案\": 23, \"闭环\": 16}, \"feedback\": \"简要点评（50-120字，指出做得好与可改进之处）\"}\n\n对话记录：\n{dialogue}","dims":[{"name":"共情先行","key":"共情","max":25},{"name":"辨真假提问","key":"辨真","max":25},{"name":"针对性方案","key":"方案","max":30},{"name":"主线闭环","key":"闭环","max":20}]}],"ch6WritingDrills":[{"id":"wd1","title":"✍️ 练习一 · 学情反馈话术","scene":"你刚带完洋阳这一阶段的学习，现在要主动给洋阳妈妈发一段学情反馈。","student_info":"<strong>洋阳</strong>，9 岁男孩，三年级，豌豆思维 <strong>S6 级别</strong>在读，剩余 <strong>28 课时</strong>。课堂状态不错、愿意互动，学习习惯较好、基础计算扎实；但<strong>分析、推理和表达能力还有提升空间</strong>。最近学了《构建策略》和《观察推理》两个专题。妈妈负责学习安排，爸爸负责付款。","task":"请写一段给洋阳妈妈的学情反馈话术，<strong>至少 80 字</strong>。要求覆盖：① 最近学的<strong>具体专题名</strong> ② <strong>可量化的进步</strong>（不要只写形容词） ③ <strong>一个待提升点</strong> ④ 针对这个提升点给出<strong>办法</strong> ⑤ 语气亲切、有温度。","min_len":80,"placeholder":"请输入你的学情反馈话术（至少 80 字）...\n\n参考框架：\n1. 开场+专题：孩子最近学习了《XX》，这个专题主要培养的是……\n2. 进步外化：从……到……（用可量化的变化，如正确率、主动发言）\n3. 待提升点：不过孩子在……这一块还需要持续练\n4. 给出办法：妈妈不要太着急，我们会……\n5. 收尾：想问问您对新阶段有什么期望","dims":[{"name":"专题与知识点","max":20,"kw":["专题","构建策略","观察推理","空间","推理","图形","拼图","有序","知识点","内容","最近","学习了","掌握"]},{"name":"可量化进步外化","max":20,"kw":["正确率","从","升到","提升到","主动","举手","发言","专注","以前","现在","变化","进步","明显","稳定","越来越"]},{"name":"待提升点","max":20,"kw":["不过","但是","还需要","待提升","薄弱","提升空间","注意","欠缺","不够","可以加强","建议"]},{"name":"配套办法","max":20,"kw":["不要太着急","一起帮","办法","课后可以","我会","老师会","配合","建议","练习","带他","跟进","巩固","坚持"]},{"name":"亲和与温度","max":20,"kw":["妈妈","宝贝","孩子","理解","辛苦","放心","欣慰","高兴","期望","希望","您","谢谢","辛苦您"]}],"ref_answer":"妈妈您好，跟您分享下洋阳最近的学习情况。这两周我们主要学了《构建策略》和《观察推理》两个专题——前者是通过观察轮廓和图案特征完成拼图、用不同图形铺路，重点培养空间想象力和有序思维；后者练习联想、轨迹、顺序和因果推理，重点是分析和表达能力。<br><br>进步挺实在的：您看课后巩固的正确率，从刚开始的六成左右，现在已经稳定在八五成；课堂上他也明显更愿意举手了，以前要老师点名才说，现在会主动举手讲自己的思路。<br><br>不过有一点我想跟您提一下：他在<strong>「分步表达」</strong>上还需要再练——就是做完题能一步步说清自己先算什么、后算什么。这个妈妈不用太着急，我这边会带着他每次课做一次「开口讲」，把思路复述一遍，练几周就会有感觉。<br><br>想问下您，接下来这个阶段，您希望洋阳重点提升的是哪方面呢？","ref_tips":"复盘要点：① 反馈要「具体到专题名」，不说「最近学得不错」；② 进步必须可量化，正确率、举手次数这类能验证的证据最有力量；③ 问题必须配办法，只说问题会制造焦虑；④ 结尾一定要问期望——家长说出来的期望，才是后面课程规划的靶子。"},{"id":"wd2","title":"✍️ 练习二 · 课时账＋推单话术","scene":"妈妈问：「洋阳还剩多少课？后面大概要怎么安排，要花多少钱？」你要在一段话里把课时账和方案说清楚，并推动她今天做决定。","student_info":"洋阳，三年级，S6 级别在读。已学课时折算后<strong>剩余 28 课时</strong>，按每周 1 次课计算约可学到<strong>明年 3 月</strong>。若把 <strong>S6 学完还需约 44 课时</strong>；若规划到 <strong>S7 学完共需约 96 课时</strong>。当前正值开学季活动，首轮补贴力度最大。","task":"请写一段给洋阳妈妈的课时账＋推单话术，<strong>至少 100 字</strong>。要求覆盖：① 说清<strong>剩余课时与可学到的程度</strong> ② 给出<strong>两个方案</strong>（长期／短期）并说明各自特点 ③ <strong>把总价折算成每节课单价</strong> ④ 讲清<strong>活动时效</strong> ⑤ 给出一个<strong>明确的下一步动作</strong>。","min_len":100,"placeholder":"请输入你的课时账＋推单话术（至少 100 字）...\n\n参考框架：\n1. 课时账：现在还剩余 XX 课时，可以学到 X 月份；把 S6 学完还需要 XX 课时；规划到 S7 需要 XX 课时\n2. 两个方案：长期方案（课时多、总价高、单价低）／短期方案（课时少、总价低、单价高一些）\n3. 单价折算：算下来每节课才 XX 元，一个月也就 XXX 元\n4. 活动时效：现在正是开学季首轮，力度最大，之后政策就不一样了\n5. 收口：我马上把报名链接传给您，一步步带您完成缴费流程","dims":[{"name":"课时账清晰","max":20,"kw":["课时","剩余","28","学到","月份","学完","需要","还差","S6","S7","44","96","三个月","安排"]},{"name":"两个方案","max":20,"kw":["方案","长期","短期","规划到","至少","学完整","一个方案","另一个","倾向","选择"]},{"name":"单价折算","max":20,"kw":["每节课","每节","单价","平均","一个月","折算","相当于","一顿饭","算下来","才","元"]},{"name":"活动时效","max":20,"kw":["活动","开学季","首轮","补贴","名额","限时","力度","政策","不一样","截止","现在","这次"]},{"name":"收口动作","max":20,"kw":["报名链接","链接","帮您","锁定","名额","登记","今天","确定","申请","缴费","下一步","传给您"]}],"ref_answer":"妈妈，我先跟您把账算清楚。洋阳现在还剩 28 课时，按每周一次算大概能学到明年 3 月；如果想把 S6 这个级别学完整，还需要大约 44 课时；要是直接规划到 S7 学完，一共需要约 96 课时。<br><br>所以给您准备了两个方案：<br>· <strong>长期方案</strong>——一次规划到 S7 结束，课时多、总价高一些，但<strong>单价最低</strong>，而且赠送的课时、豌豆币、打卡次数都算上，性价比最高；<br>· <strong>短期方案</strong>——先规划到 S6 学完，课时少、总价低，单价会高一点点，但能守住「至少把当前级别学完整」这条线。<br><br>折算下来，长期方案每节课才 60 多元，一个月也就 600 出头，说实话差不多就是一家人出去吃顿饭的钱。<br><br>另外提醒您一下，现在刚好是开学季的首轮补贴，力度是全年最大的，课时和价格都给得最足；这轮过了，后面再安排政策就不一样了。<br><br>您更倾向长期还是短期呢？如果确定下来，我马上把报名链接传给您，一步步带您完成缴费流程。","ref_tips":"复盘要点：① 课时账必须先算清，数字是后面所有说服的参照物；② 一定要给两个方案——给选择，不给压力，短期方案负责守住底线；③ 单价折算的威力在于「把大数字变小数字」，再类比日常消费；④ 活动时效不是催单，是让家长知道「现在规划确实更合适」；⑤ 结尾必须落在具体动作上，不能停在「您考虑一下」。"},{"id":"wd3","title":"✍️ 练习三 · 异议处理话术","scene":"妈妈说：「三年级作业一下子多了，我怕他顾不过来。而且这么多钱，我还得跟他爸商量商量。」请写一段回应。","student_info":"洋阳，三年级，S6 级别在读，剩余 28 课时。妈妈的顾虑：① 三年级作业变多，怕孩子顾不过来；② 价格不低，需要跟洋阳爸爸商量（爸爸是付款人，但平时不管孩子学习）。","task":"请写一段回应妈妈这两个顾虑的话术，<strong>至少 100 字</strong>。要求覆盖：① 先<strong>共情认同</strong>，不直接反驳 ② 用<strong>提问确认</strong>她真正担心的是什么 ③ 针对两个顾虑分别给出<strong>具体安排</strong> ④ 最后<strong>回到主线推进</strong>。","min_len":100,"placeholder":"请输入你的异议处理话术（至少 100 字）...\n\n参考框架：\n1. 共情：我非常理解您的想法，……\n2. 辨真假：您主要是担心时间排不开，还是担心孩子太累呀？\n3. 针对时间给方案：其实我们每周只有一次课，时间是可以……\n4. 针对商量给方案：孩子学习一直是您在跟，最了解他的就是您……\n5. 回主线：所以咱们先把后面的安排定下来，我帮您……","dims":[{"name":"共情先行","max":20,"kw":["理解","明白","确实","您说得对","我懂","换我我也会","不着急","顾虑","体谅","很正常","挺担心"]},{"name":"提问辨真假","max":20,"kw":["主要担心","具体是","是担心","还是","方便说一下","我了解一下","那您","如果","哪一种","是不是"]},{"name":"时间顾虑方案","max":20,"kw":["时间","每周一次","排课","调整","周末","固定","节奏","安排","提前定","不用担心","一次课","不会太累","合理"]},{"name":"商量顾虑方案","max":20,"kw":["爸爸","商量","谁最了解","规划者","您最清楚","一起了解","发给他","学习群","不关注","引导参与","让他看到","您做主"]},{"name":"主线闭环","max":20,"kw":["所以","那我们就","接下来","帮您","先","下一步","这样安排","定下来","继续","推进","您看"]}],"ref_answer":"妈妈，我特别理解您的顾虑——孩子三年级作业一下多起来，怕他顾不过来，这个想法太正常了；而且这确实不是一笔小钱，要跟爸爸商量也是应该的，换我我也会这么做。<br><br>不过我想先跟您确认一下：您<strong>主要是担心时间排不开，还是担心孩子太累、跟不上</strong>？<br><br>如果是时间上的事，其实不用太担心：我们平时<strong>每周只有一次课</strong>，而且时间是可以跟您协调的。我建议咱们<strong>提前把新学期的固定时段定下来</strong>，比如周末上午，孩子养成节奏之后反而更省心，不会跟校内作业打架。<br><br>至于跟爸爸商量——妈妈，其实孩子学习一直是您在跟，他学到哪儿了、哪块还不行，最清楚的其实是您。我的建议是：您先把后面的安排定下来，我这边把洋阳最近的学习情况整理一份发给您，您转给爸爸一起看看；也把爸爸拉进咱们的学习群，让他也能看到孩子的课堂表现。这样他也就放心了。<br><br>那咱们就先按长期方案把新学期的时间定下来，我马上把安排和链接发给您，您看可以吗？","ref_tips":"复盘要点：① 第一句永远是「我理解」，不是「不是这样的」——直接反驳会让对话中断；② 用提问把「真实顾虑」挖出来，很多家长说「没时间」，真正担心的是效果或成本；③ 两个顾虑要分别给办法，笼统安慰没有用；④ 处理完必须回到主线——很多同学卡在「答完就停了」，忘了继续推进。"}]}</script>

<script>
// ============================================================
// 《续费全流程实战》微课 · 应用逻辑
// 数据从 #appDataJson 读取（JSON），避免转义问题
